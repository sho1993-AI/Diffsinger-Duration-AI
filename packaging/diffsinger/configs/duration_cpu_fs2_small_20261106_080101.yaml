base_config:
- configs/variance.yaml
dictionaries:
  ja: /workspaces/Diffsinger-Duration-AI/data/duration_cpu/phonemes.txt
extra_phonemes: []
merged_phoneme_groups:
- - AP
  - SP
datasets:
- raw_data_dir: /workspaces/Diffsinger-Duration-AI/data/duration_cpu/raw_mora
  speaker: sho
  spk_id: 0
  language: ja
  test_prefixes:
  - data-kaza-001
binary_data_dir: data/duration_cpu/binary_allphones
binarization_args:
  num_workers: 0
  allow_unseen_phonemes: true
pe: parselmouth
pe_ckpt: checkpoints/rmvpe/model.pt
hnsep: vr
hnsep_ckpt: checkpoints/vr/model.pt
use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
predict_dur: true
predict_pitch: false
predict_energy: false
predict_breathiness: false
predict_voicing: false
predict_tension: false
energy_db_min: -96.0
energy_db_max: -12.0
breathiness_db_min: -96.0
breathiness_db_max: -20.0
voicing_db_min: -96.0
voicing_db_max: -12.0
tension_logit_min: -10.0
tension_logit_max: 10.0
enc_ffn_kernel_size: 3
use_rope: true
rope_interleaved: false
use_stretch_embed: false
use_variance_scaling: true
hidden_size: 96
dur_prediction_args:
  arch: fs2
  hidden_size: 96
  dropout: 0.1
  num_layers: 2
  kernel_size: 3
  log_offset: 1.0
  loss_type: mse
  lambda_pdur_loss: 0.3
  lambda_wdur_loss: 1.0
  lambda_sdur_loss: 3.0
  dur_num_blocks: 1
  dur_num_heads: 2
  dur_radius: 8
  dur_ffn_mult: 2
use_melody_encoder: true
melody_encoder_args:
  hidden_size: 128
  enc_layers: 4
use_glide_embed: false
glide_types:
- up
- down
glide_embed_scale: 11.31370849898476
diffusion_type: reflow
pitch_prediction_args:
  pitd_norm_min: -8.0
  pitd_norm_max: 8.0
  pitd_clip_min: -12.0
  pitd_clip_max: 12.0
  repeat_bins: 64
  backbone_type: lynxnet2
  backbone_args:
    num_layers: 6
    num_channels: 512
    dropout_rate: 0.0
    use_conditioner_cache: true
    glu_type: atanglu
variances_prediction_args:
  total_repeat_bins: 72
  backbone_type: lynxnet2
  backbone_args:
    num_layers: 6
    num_channels: 384
    dropout_rate: 0.0
    use_conditioner_cache: true
    glu_type: atanglu
lambda_dur_loss: 1.0
lambda_pitch_loss: 1.0
lambda_var_loss: 1.0
optimizer_args:
  optimizer_cls: modules.optimizer.muon.Muon_AdamW
  lr: 0.0006
  muon_args:
    weight_decay: 0.1
  adamw_args:
    weight_decay: 0.0
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.StepLR
  step_size: 5000
  gamma: 0.75
max_batch_frames: 20000
max_batch_size: 16
max_updates: 30
num_valid_plots: 10
val_check_interval: 10
num_ckpt_keep: 8
permanent_ckpt_start: 30000
permanent_ckpt_interval: 10000
pl_trainer_devices: 1
pl_trainer_precision: 32-true
use_fused_kernels: false
ds_workers: 1
enc_layers: 2
max_val_batch_frames: 20000
max_val_batch_size: 1
pl_trainer_accelerator: cpu
pl_trainer_strategy:
  name: auto
  process_group_backend: gloo
  find_unused_parameters: false
nccl_p2p: false
