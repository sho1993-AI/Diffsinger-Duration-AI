  function renderInference(segmentIndex = 0) {
    const data = state.inference;
    if (!data || !data.segments.length) return;
    state.segment = Math.min(segmentIndex, data.segments.length - 1);
    const segment = data.segments[state.segment];
    const phones = segment.phonemes || [];
    const notes = segment.notes || [];
    const unsupported = unsupportedPhones();
    const untrained = untrainedPhones();
    const editable = /\.(ds|json)$/i.test(state.sourceName);
    const sum = phones.reduce((total, item) => total + (Number(item.duration) || 0), 0);
    const noteSum = notes.reduce((total, item) => total + (Number(item.duration) || 0), 0);
    const estimated = phones.some((item) => item.duration == null);
    const noteTrack = notes.length ? `<div class="section-label"><span>入力ノート</span><span>${notes.length} 音符</span></div>${timeline(notes, "音符", sum)}` : "";
    const segmentSelect = data.segments.length > 1 ? `<label class="subtitle">フレーズ <select id="segment-select">${data.segments.map((item, index) => `<option value="${index}" ${index === state.segment ? "selected" : ""}>${index + 1} · ${escapeHtml((item.text || "無題").slice(0, 22))}</option>`).join("")}</select></label>` : "";
    const audioUrl = state.audioUrl;
    const modelVersion = data.checkpoint == null ? "事前学習済み" : `step ${data.checkpoint}`;
    const predictedBy = data.model ? ` · ${escapeHtml(data.model)} / ${modelVersion}` : "";
    const calibratedLeadingCount = Number(data.calibrated_leading_count) || 0;
    const phonemeTable = phones.map((item, index) => {
      const start = phones.slice(0, index).reduce((total, phone) => total + (Number(phone.duration) || 0), 0);
      return {...item, start, end: start + (Number(item.duration) || 0)};
    });
    $("#detail").innerHTML = `
      <div class="content-head"><div><h2>${escapeHtml(data.name)}</h2><div class="subtitle">推論入力 · 音素列${segment.text ? ` · ${escapeHtml(segment.text)}` : ""}${predictedBy}</div></div><div class="stats"><div class="stat"><span>音素数</span><strong>${phones.length}</strong></div><div class="stat"><span>Duration</span><strong>${sum ? seconds(sum) : "—"}</strong></div></div></div>
      ${segmentSelect}
      ${editable ? renderEditor(segment, state.segment) : ""}
      ${editable ? renderArrangement() : ""}
      ${state.synthesisRunning || state.synthesisLogs.length ? `<div class="synthesis-monitor" aria-live="polite"><div class="section-label"><span>リアルタイム合成 · フレーズ ${state.synthesisCompleted}/${state.synthesisTotal || data.segments.length}</span><span id="synthesis-progress-label">${state.synthesisRunning ? "処理中" : "完了"}</span></div><progress id="synthesis-progress" max="${state.synthesisTotal || data.segments.length}" value="${state.synthesisCompleted}"></progress><canvas class="live-spectrogram" id="live-spectrogram" aria-label="合成中のリアルタイムスペクトログラム"></canvas><pre class="synthesis-log" id="synthesis-log">${state.synthesisLogs.map(escapeHtml).join("\n")}</pre></div>` : ""}
      ${audioUrl ? `<div class="section-label"><span>推論音声スペクトログラム</span><span>境界線: 予測音素duration</span></div><canvas class="spectrogram" id="spectrogram" aria-label="推論音声スペクトログラム"></canvas><div class="time-axis"><span>フレーズ開始</span><span>${seconds(noteSum || sum)}</span></div>` : '<div class="empty">対応する推論WAVを選ぶと、ここにスペクトログラムが表示されます</div>'}
      <div class="section-label"><span>推論音素タイムライン</span><span>縦線: 音素境界</span></div>
      ${timeline(phones, "音素", sum)}
      ${audioUrl ? `<div class="inference-actions"><audio controls preload="metadata" src="${escapeHtml(audioUrl)}"></audio>${state.generatedAudio ? `<a href="${escapeHtml(audioUrl)}" download="synthesis.wav">合成WAVを保存</a>` : ""}</div>` : ""}
      ${noteTrack}
      ${calibratedLeadingCount ? `<div class="notice">句頭音素${calibratedLeadingCount}件を教師データ平均へ近づけ、最大0.30秒に調整しました。余剰時間は後続音素へ配分しています。</div>` : ""}
      ${estimated ? '<div class="notice">ph_durのない音素は順序のみ表示しています。表示幅は均等で、予測durationではありません。</div>' : ""}
      ${segment.duration_mismatch ? '<div class="notice">警告: ph_seqとph_durの数が一致しません。時間のない音素があります。</div>' : ""}
      ${unsupported.length ? `<div class="notice">選択モデルの学習辞書にない音素: ${unsupported.map(escapeHtml).join(" ")}。推論は実行できません。</div>` : ""}
      ${untrained.length ? `<div class="notice">教師例がなく未学習の音素: ${untrained.map(escapeHtml).join(" ")}。推論できますが、予測品質は保証されません。</div>` : ""}
      <div class="section-label"><span>DS音素一覧 · ph_seq</span><span>offset ${Number(segment.offset || 0).toFixed(2)} s</span></div>
      ${renderTable(phonemeTable)}`;
    if (audioUrl) {
      const boundaries = [];
      let elapsed = 0;
      phones.slice(0, -1).forEach((phone) => {
        elapsed += Number(phone.duration) || 0;
        boundaries.push(sum ? elapsed / sum : 0);
      });
      drawSpectrogram(audioUrl, {
        duration: noteSum || sum,
        offset: Number(segment.offset) || 0,
        boundaries,
      });
    }
    const select = $("#segment-select");
    if (select) select.addEventListener("change", () => {
      stopTransport();
      state.editor.selectedNote = -1;
      renderInference(Number(select.value));
    });
    if (editable) {
      bindEditor(segment);
      bindArrangement();
    }
  }

  async function drawSpectrogram(url, options = {}) {
    const canvas = $("#spectrogram");
    if (!canvas) return;
    const context = canvas.getContext("2d");
    const width = canvas.clientWidth || 500;
    const height = canvas.clientHeight || 190;
    canvas.width = width;
    canvas.height = height;
    try {
      const audioData = await (await fetch(url)).arrayBuffer();
      const audioContext = new AudioContext();
      const buffer = await audioContext.decodeAudioData(audioData);
      const channel = buffer.getChannelData(0);
      const requestedOffset = Number(options.offset) || 0;
      const requestedDuration = Number(options.duration) || buffer.duration;
      const start = requestedOffset + requestedDuration <= buffer.duration ? requestedOffset : 0;
      const duration = Math.min(requestedDuration, buffer.duration - start);
      const fftSize = 1024;
      const real = new Float32Array(fftSize);
      const imaginary = new Float32Array(fftSize);
      const image = context.createImageData(width, height);
      const maxBin = Math.min(fftSize / 2, Math.floor(8000 * fftSize / buffer.sampleRate));
      const bins = Array.from({length: height}, (_, y) => Math.min(maxBin, Math.max(1, Math.round((1 - y / height) * maxBin))));
      const palette = (level) => {
        const t = Math.max(0, Math.min(1, level));
        return [Math.round(18 + 237 * t), Math.round(44 + 167 * Math.sin(t * Math.PI / 2)), Math.round(51 + 95 * (1 - t))];
      };
      const frameCount = width;
      for (let frame = 0; frame < frameCount; frame++) {
        const center = Math.round((start + duration * (frame + .5) / frameCount) * buffer.sampleRate);
        for (let index = 0; index < fftSize; index++) {
          const sample = channel[Math.max(0, Math.min(channel.length - 1, center + index - fftSize / 2))] || 0;
          real[index] = sample * (.5 - .5 * Math.cos(2 * Math.PI * index / (fftSize - 1)));
          imaginary[index] = 0;
        }
        for (let index = 1, reversed = 0; index < fftSize; index++) {
          let bit = fftSize >> 1;
          for (; reversed & bit; bit >>= 1) reversed ^= bit;
          reversed ^= bit;
          if (index < reversed) {
            [real[index], real[reversed]] = [real[reversed], real[index]];
            [imaginary[index], imaginary[reversed]] = [imaginary[reversed], imaginary[index]];
          }
        }
        for (let size = 2; size <= fftSize; size <<= 1) {
          const angle = -2 * Math.PI / size;
          const stepReal = Math.cos(angle);
          const stepImaginary = Math.sin(angle);
          for (let offset = 0; offset < fftSize; offset += size) {
            let factorReal = 1;
            let factorImaginary = 0;
            for (let index = 0; index < size / 2; index++) {
              const even = offset + index;
              const odd = even + size / 2;
              const oddReal = real[odd] * factorReal - imaginary[odd] * factorImaginary;
              const oddImaginary = real[odd] * factorImaginary + imaginary[odd] * factorReal;
              real[odd] = real[even] - oddReal;
              imaginary[odd] = imaginary[even] - oddImaginary;
              real[even] += oddReal;
              imaginary[even] += oddImaginary;
              const nextReal = factorReal * stepReal - factorImaginary * stepImaginary;
              factorImaginary = factorReal * stepImaginary + factorImaginary * stepReal;
              factorReal = nextReal;
            }
          }
        }
        const x = Math.floor(frame * width / frameCount);
        for (let y = 0; y < height; y++) {
          const bin = bins[y];
          const magnitude = Math.hypot(real[bin], imaginary[bin]) / fftSize;
          const db = 20 * Math.log10(magnitude + 1e-8);
          const color = palette((db + 75) / 65);
          const pixel = (y * width + x) * 4;
          image.data[pixel] = color[0];
          image.data[pixel + 1] = color[1];
          image.data[pixel + 2] = color[2];
          image.data[pixel + 3] = 255;
        }
      }
      context.putImageData(image, 0, 0);
      const boundaries = options.boundaries || (options.labels || []).slice(0, -1).map((item) => item.end / duration);
      context.strokeStyle = "#ff705e";
      context.lineWidth = 1.5;
      boundaries.forEach((point) => {
        const x = Math.round(Math.max(0, Math.min(1, point)) * width) + .5;
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, height);
        context.stroke();
      });
      await audioContext.close();
    } catch (error) {
      context.fillStyle = "#e4ece8";
      context.font = "11px sans-serif";
      context.fillText("スペクトログラムを読み込めません", 8, 20);
    }
  }

  async function loadInferenceSample(name) {
    if (!name) return;
    try {
      const response = await fetch(`/api/inference-sample?name=${encodeURIComponent(name)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "読み込みに失敗しました");
      stopTransport();
      resetSynthesisState();
      clearInferenceAudio();
      state.inference = data;
      state.sourceText = data.source;
      state.sourceName = name;
      state.projectTracks = [{name, sourceName: name, sourceText: data.source, inference: data}];
      state.activeTrackIndex = 0;
      state.segment = 0;
      state.editor.selectedNote = -1;
      state.undoStack = [];
      state.redoStack = [];
      updatePredictButton();
      renderInference();
      renderProjectTracks();
    } catch (error) { $("#detail").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`; }
  }

  function parseUst(text, filename) {
    const settings = {};
    const notes = [];
    const noteBySection = new Map();
    let section = "";
    let cursor = 0;
    for (const rawLine of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
      const line = rawLine.trim();
      const header = /^\[#([^\]]+)\]$/.exec(line);
      if (header) {
        section = header[1].toUpperCase();
        if (/^\d+$/.test(section) && !noteBySection.has(section)) {
          const note = {section, startTicks: cursor, durationTicks: 0, midi: 60, lyric: "あ"};
          noteBySection.set(section, note);
          notes.push(note);
        }
        continue;
      }
      const split = line.indexOf("=");
      if (split < 0) continue;
      const key = line.slice(0, split).trim().toLowerCase();
      const value = line.slice(split + 1).trim();
      if (section === "SETTING") {
        settings[key] = value;
      } else if (section === "TRACKEND" || section === "END") {
        break;
      } else if (noteBySection.has(section)) {
        const note = noteBySection.get(section);
        if (key === "length") {
          const length = Number(value);
          if (Number.isFinite(length) && length > 0) {
            note.durationTicks = length;
            cursor = note.startTicks + length;
          }
        } else if (key === "notenum") {
          note.midi = Number(value);
        } else if (key === "lyric") {
          note.lyric = value;
        }
      }
    }
    const bpm = Number(settings.tempo) || 120;
    const validNotes = notes.filter((note) => note.durationTicks > 0 && Number.isFinite(note.midi));
    if (!validNotes.length) throw new Error("USTに読み込めるノートがありません");
    return [{name: filename.replace(/\.[^.]+$/, ""), notes: validNotes, bpm, resolution: 480, numerator: 4, denominator: 4}];
  }

  async function decodeProjectText(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes[0] === 0xff && bytes[1] === 0xfe) return new TextDecoder("utf-16le").decode(bytes.subarray(2));
    if (bytes[0] === 0xfe && bytes[1] === 0xff) return new TextDecoder("utf-16be").decode(bytes.subarray(2));
    try {
      return new TextDecoder("utf-8", {fatal: true}).decode(bytes);
    } catch (error) {
      if (file.name.toLowerCase().endsWith(".ust")) {
        try { return new TextDecoder("shift_jis").decode(bytes); } catch { /* use the UTF-8 error below */ }
      }
      throw new Error(`${file.name}: 文字コードを読み取れません (${error.message})`);
    }
  }

  function yamlScalar(value) {
    const scalar = value.trim().replace(/,\s*$/, "");
    if (scalar.startsWith('"') && scalar.endsWith('"')) {
      try { return JSON.parse(scalar); } catch { return scalar.slice(1, -1); }
    }
    if (scalar.startsWith("'") && scalar.endsWith("'")) return scalar.slice(1, -1).replace(/''/g, "'");
    return scalar;
  }

  function parseUstx(text, filename) {
    const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
    const bpm = Number(/^\s*bpm:\s*([\d.]+)/m.exec(text)?.[1]) || 120;
    const resolution = Number(/^\s*resolution:\s*(\d+)/m.exec(text)?.[1]) || 480;
    const numerator = Number(/^\s*beat_per_bar:\s*(\d+)/m.exec(text)?.[1]) || 4;
    const denominator = Number(/^\s*beat_unit:\s*(\d+)/m.exec(text)?.[1]) || 4;
    const tracks = [];
    let currentTrack = null;
    let notesIndent = -1;
    let currentNote = null;
    const finishNote = () => {
      if (currentTrack && currentNote && Number.isFinite(currentNote.startTicks) && Number.isFinite(currentNote.durationTicks) && Number.isFinite(currentNote.midi)) {
        currentTrack.notes.push({...currentNote, lyric: currentNote.lyric || "あ"});
      }
      currentNote = null;
    };
    for (const line of lines) {
      const indent = line.length - line.trimStart().length;
      const trimmed = line.trim();
      if (/^-\s*track_no\s*:/.test(trimmed)) {
        finishNote();
        currentTrack = {name: `Track ${tracks.length + 1}`, notes: [], bpm, resolution, numerator, denominator};
        tracks.push(currentTrack);
        notesIndent = -1;
        continue;
      }
      if (!currentTrack) continue;
      if (/^track_name\s*:/.test(trimmed)) {
        currentTrack.name = String(yamlScalar(trimmed.slice(trimmed.indexOf(":") + 1)));
        continue;
      }
      if (/^notes\s*:\s*$/.test(trimmed)) {
        finishNote();
        notesIndent = indent;
        continue;
      }
      if (notesIndent >= 0 && indent <= notesIndent && trimmed &&
          !trimmed.startsWith("#") && !/^-\s*(?:position|pos)\s*:/.test(trimmed)) {
        finishNote();
        notesIndent = -1;
      }
      if (notesIndent < 0) continue;
      if (/^-\s*(?:position|pos)\s*:/.test(trimmed)) {
        finishNote();
        currentNote = {};
        const pair = /^-\s*([^:]+)\s*:\s*(.*)$/.exec(trimmed);
        if (pair) {
          currentNote[pair[1].trim()] = yamlScalar(pair[2]);
          if (/^(position|pos)$/i.test(pair[1].trim())) currentNote.startTicks = Number(pair[2]);
        }
        continue;
      }
      if (!currentNote) continue;
      const pair = /^([A-Za-z_][\w-]*)\s*:\s*(.*?)\s*$/.exec(trimmed);
      if (!pair) continue;
      currentNote[pair[1]] = yamlScalar(pair[2]);
      if (pair[1] === "position" || pair[1] === "pos") currentNote.startTicks = Number(pair[2]);
      if (pair[1] === "duration" || pair[1] === "dur") currentNote.durationTicks = Number(pair[2]);
      if (pair[1] === "tone" || pair[1] === "pitch") currentNote.midi = Number(pair[2]);
      if (pair[1] === "lyric") currentNote.lyric = String(yamlScalar(pair[2]));
    }
    finishNote();
    const valid = tracks.filter((track) => track.notes.length);
    if (!valid.length) throw new Error("USTXに読み込めるトラック/ノートがありません");
    return valid.map((track) => ({...track, name: track.name || filename.replace(/\.[^.]+$/, "")}));
  }

  function parseMidi(bytes, filename) {
    const view = new DataView(bytes);
    let position = 0;
    const readAscii = (length) => {
      let result = "";
      for (let index = 0; index < length; index++) result += String.fromCharCode(view.getUint8(position++));
      return result;
    };
    const readUint32 = () => { const value = view.getUint32(position); position += 4; return value; };
    const readUint16 = () => { const value = view.getUint16(position); position += 2; return value; };
    const readVariable = (end) => {
      let value = 0;
      let byte;
      do {
        if (position >= end) throw new Error("MIDIのイベントデータが途中で終わっています");
        byte = view.getUint8(position++);
        value = (value << 7) | (byte & 0x7f);
      } while (byte & 0x80);
      return value;
    };
    if (readAscii(4) !== "MThd") throw new Error("MIDIヘッダーがありません");
    const headerLength = readUint32();
    if (headerLength < 6) throw new Error("MIDIヘッダーが不正です");
    const format = readUint16();
    const trackCount = readUint16();
    const division = readUint16();
    position += headerLength - 6;
    if (division & 0x8000) throw new Error("SMPTEタイムベースMIDIは未対応です");
    const resolution = division || 480;
    let bpm = 120;
    let numerator = 4;
    let denominator = 4;
    const tempoChanges = [];
    let order = 0;
    const tracks = [];
    for (let trackIndex = 0; trackIndex < trackCount; trackIndex++) {
      if (readAscii(4) !== "MTrk") throw new Error("MIDIトラックチャンクが不正です");
      const end = position + readUint32();
      let tick = 0;
      let runningStatus = 0;
      let name = `Track ${trackIndex + 1}`;
      const events = [];
      const active = new Map();
      const lyrics = [];
      while (position < end) {
        tick += readVariable(end);
        let status = view.getUint8(position);
        if (status & 0x80) {
          position++;
          runningStatus = status;
        } else {
          status = runningStatus;
        }
        if (status === 0xff) {
          const type = view.getUint8(position++);
          const length = readVariable(end);
          if (position + length > end) throw new Error("MIDIメタイベントが不正です");
          if (type === 0x03) name = new TextDecoder().decode(new Uint8Array(bytes, position, length)) || name;
          if (type === 0x05) lyrics.push({tick, lyric: new TextDecoder().decode(new Uint8Array(bytes, position, length))});
          if (type === 0x51 && length === 3) {
            const micros = (view.getUint8(position) << 16) | (view.getUint8(position + 1) << 8) | view.getUint8(position + 2);
            if (micros > 0) {
              tempoChanges.push({tick, micros, order: order++});
              if (tick === 0 && tempoChanges.length === 1) bpm = 60_000_000 / micros;
            }
          }
          if (type === 0x58 && length >= 2 && tick === 0) {
            numerator = view.getUint8(position);
            denominator = 2 ** view.getUint8(position + 1);
          }
          position += length;
          if (type === 0x2f) break;
          continue;
        }
        if (status === 0xf0 || status === 0xf7) {
          position += readVariable(end);
          continue;
        }
        const command = status & 0xf0;
        const channel = status & 0x0f;
        if (command === 0xc0 || command === 0xd0) {
          position++;
          continue;
        }
        if (position + 2 > end) throw new Error("MIDIノートイベントが途中で終わっています");
        const pitch = view.getUint8(position++);
        const velocity = view.getUint8(position++);
        const key = `${channel}:${pitch}`;
        if (command === 0x90 && velocity > 0) {
          const pending = active.get(key) || [];
          pending.push({startTicks: tick, midi: pitch, velocity});
          active.set(key, pending);
        } else if (command === 0x80 || (command === 0x90 && velocity === 0)) {
          const pending = active.get(key);
          if (pending?.length) {
            const note = pending.shift();
            if (tick > note.startTicks) events.push({...note, durationTicks: tick - note.startTicks});
          }
        }
      }
      for (const pending of active.values()) {
        for (const note of pending) events.push({...note, durationTicks: resolution});
      }
      events.sort((left, right) => left.startTicks - right.startTicks || right.midi - left.midi);
      if (events.length) {
        for (const note of events) {
          const lyric = lyrics.find((item) => item.tick === note.startTicks)?.lyric;
          note.lyric = lyric || "あ";
        }
        tracks.push({name, notes: events, bpm, resolution, numerator, denominator, format});
      }
      position = end;
    }
    if (!tracks.length) throw new Error("MIDIに歌声として読み込めるノートがありません");
    tempoChanges.sort((left, right) => left.tick - right.tick || left.order - right.order);
    if (!tempoChanges.length || tempoChanges[0].tick > 0) {
      tempoChanges.unshift({tick: 0, micros: 60_000_000 / bpm, order: -1});
    }
    const tickToSeconds = (targetTick) => {
      let elapsed = 0;
      let previousTick = 0;
      let micros = tempoChanges[0].micros;
      for (const change of tempoChanges) {
        if (change.tick >= targetTick) break;
        if (change.tick > previousTick) elapsed += (change.tick - previousTick) * micros / 1_000_000 / resolution;
        previousTick = change.tick;
        micros = change.micros;
      }
      return elapsed + (targetTick - previousTick) * micros / 1_000_000 / resolution;
    };
    for (const track of tracks) {
      for (const note of track.notes) {
        note.startSeconds = tickToSeconds(note.startTicks);
        note.durationSeconds = tickToSeconds(note.startTicks + note.durationTicks) - note.startSeconds;
      }
    }
    return tracks;
  }

  function xmlChildren(node, name) {
    return Array.from(node.getElementsByTagName("*")).filter((item) => item.localName === name);
  }

  function xmlValue(node, name, fallback = "") {
    return xmlChildren(node, name)[0]?.textContent?.trim() || fallback;
  }

  function parseVsqx(text, filename) {
    const documentXml = new DOMParser().parseFromString(text, "application/xml");
    if (documentXml.querySelector("parsererror")) throw new Error("VSQX XMLを解析できません");
    const resolution = Number(xmlValue(documentXml, "resolution", "480")) || 480;
    const bpmNode = xmlChildren(documentXml, "tempo")[0];
    const rawBpm = Number(xmlValue(bpmNode || documentXml, "bpm", "120")) || 120;
    const bpm = rawBpm > 1000 ? rawBpm / 100 : rawBpm;
    const numerator = Number(xmlValue(xmlChildren(documentXml, "timeSig")[0] || documentXml, "nume", "4")) || 4;
    const denominator = Number(xmlValue(xmlChildren(documentXml, "timeSig")[0] || documentXml, "denomi", "4")) || 4;
    const trackNodes = xmlChildren(documentXml, "vsTrack");
    const tracks = [];
    for (let index = 0; index < trackNodes.length; index++) {
      const trackNode = trackNodes[index];
      const trackName = xmlValue(trackNode, "name", `Track ${index + 1}`);
      const notes = xmlChildren(trackNode, "note").flatMap((node) => {
        const startTicks = Number(xmlValue(node, "posTick", ""));
        const durationTicks = Number(xmlValue(node, "durTick", ""));
        const midi = Number(xmlValue(node, "noteNum", ""));
        if (![startTicks, durationTicks, midi].every(Number.isFinite) || durationTicks <= 0) return [];
        return [{startTicks, durationTicks, midi, lyric: xmlValue(node, "lyric", "あ")}];
      }).sort((left, right) => left.startTicks - right.startTicks);
      if (notes.length) tracks.push({name: trackName, notes, bpm, resolution, numerator, denominator});
    }
    if (!tracks.length) throw new Error(`${filename}: VSQXに歌声ノートがありません`);
    return tracks;
  }

  async function unzipProject(bytes) {
    const view = new DataView(bytes);
    const read32 = (offset) => view.getUint32(offset, true);
    const read16 = (offset) => view.getUint16(offset, true);
    let eocd = -1;
    const searchStart = Math.max(0, bytes.byteLength - 65_557);
    for (let offset = bytes.byteLength - 22; offset >= searchStart; offset--) {
      if (read32(offset) === 0x06054b50) { eocd = offset; break; }
    }
    if (eocd < 0) throw new Error("OpenUtau .oupのZIPディレクトリが見つかりません");
    const count = read16(eocd + 10);
    let cursor = read32(eocd + 16);
    for (let index = 0; index < count; index++) {
      if (read32(cursor) !== 0x02014b50) throw new Error("OpenUtau .oupのZIPエントリが不正です");
      const method = read16(cursor + 10);
      const compressedSize = read32(cursor + 20);
      const nameLength = read16(cursor + 28);
      const extraLength = read16(cursor + 30);
      const commentLength = read16(cursor + 32);
      const localOffset = read32(cursor + 42);
      const name = new TextDecoder().decode(new Uint8Array(bytes, cursor + 46, nameLength));
      if (/\.(ustx|vsqx|ds|json)$/i.test(name)) {
        const localNameLength = read16(localOffset + 26);
        const localExtraLength = read16(localOffset + 28);
        const dataStart = localOffset + 30 + localNameLength + localExtraLength;
        const compressed = new Uint8Array(bytes, dataStart, compressedSize);
        let contentBytes;
        if (method === 0) contentBytes = compressed.slice();
        else if (method === 8 && typeof DecompressionStream !== "undefined") {
          const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          contentBytes = new Uint8Array(await new Response(stream).arrayBuffer());
        } else {
          throw new Error(`.oup内の圧縮形式に対応していません: ${name}`);
        }
        return {name, content: new TextDecoder().decode(contentBytes), bytes: contentBytes.buffer};
      }
      cursor += 46 + nameLength + extraLength + commentLength;
    }
    throw new Error("OpenUtau .oup内にUSTX/VSQX/DSトラックがありません");
  }

  const kanaMora = {
    あ:"a",い:"i",う:"u",え:"e",お:"o",か:"k a",き:"k i",く:"k u",け:"k e",こ:"k o",
    さ:"s a",し:"sh i",す:"s u",せ:"s e",そ:"s o",た:"t a",ち:"ch i",つ:"ts u",て:"t e",と:"t o",
    な:"n a",に:"n i",ぬ:"n u",ね:"n e",の:"n o",は:"h a",ひ:"h i",ふ:"f u",へ:"h e",ほ:"h o",
    ま:"m a",み:"m i",む:"m u",め:"m e",も:"m o",や:"y a",ゆ:"y u",よ:"y o",
    ら:"r a",り:"r i",る:"r u",れ:"r e",ろ:"r o",わ:"w a",を:"o",ん:"N",
    が:"g a",ぎ:"g i",ぐ:"g u",げ:"g e",ご:"g o",ざ:"z a",じ:"j i",ず:"z u",ぜ:"z e",ぞ:"z o",
    だ:"d a",ぢ:"j i",づ:"z u",で:"d e",ど:"d o",ば:"b a",び:"b i",ぶ:"b u",べ:"b e",ぼ:"b o",
    ぱ:"p a",ぴ:"p i",ぷ:"p u",ぺ:"p e",ぽ:"p o",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",っ:"q",
    きゃ:"k y a",きゅ:"k y u",きょ:"k y o",しゃ:"sh a",しゅ:"sh u",しょ:"sh o",
    ちゃ:"ch a",ちゅ:"ch u",ちょ:"ch o",にゃ:"n y a",にゅ:"n y u",にょ:"n y o",
    ひゃ:"h y a",ひゅ:"h y u",ひょ:"h y o",みゃ:"m y a",みゅ:"m y u",みょ:"m y o",
    りゃ:"r y a",りゅ:"r y u",りょ:"r y o",ぎゃ:"g y a",ぎゅ:"g y u",ぎょ:"g y o",
    じゃ:"j a",じゅ:"j u",じょ:"j o",びゃ:"b y a",びゅ:"b y u",びょ:"b y o",
    ぴゃ:"p y a",ぴゅ:"p y u",ぴょ:"p y o",ゔ:"v u",
  };
  const romajiMora = {a:"a",i:"i",u:"u",e:"e",o:"o",ka:"k a",ki:"k i",ku:"k u",ke:"k e",ko:"k o",
    sa:"s a",shi:"sh i",si:"sh i",su:"s u",se:"s e",so:"s o",ta:"t a",chi:"ch i",ti:"ch i",
    tsu:"ts u",tu:"ts u",te:"t e",to:"t o",na:"n a",ni:"n i",nu:"n u",ne:"n e",no:"n o",
    ha:"h a",hi:"h i",fu:"f u",hu:"f u",he:"h e",ho:"h o",ma:"m a",mi:"m i",mu:"m u",
    me:"m e",mo:"m o",ya:"y a",yu:"y u",yo:"y o",ra:"r a",ri:"r i",ru:"r u",re:"r e",ro:"r o",
    wa:"w a",wo:"o",n:"N",ga:"g a",gi:"g i",gu:"g u",ge:"g e",go:"g o",za:"z a",ji:"j i",
    ja:"j a",ju:"j u",jo:"j o",da:"d a",de:"d e",do:"d o",ba:"b a",bi:"b i",bu:"b u",
    be:"b e",bo:"b o",pa:"p a",pi:"p i",pu:"p u",pe:"p e",po:"p o","-":"SP",r:"SP",sil:"SP",sp:"SP"};

  function lyricToPhones(lyric) {
    const normalized = Array.from(String(lyric || "").trim().normalize("NFC"), (character) => {
      const codePoint = character.codePointAt(0);
      return codePoint >= 0x30a1 && codePoint <= 0x30f6
        ? String.fromCodePoint(codePoint - 0x60)
        : character;
    }).join("");
    if (!normalized || /^(r|rest|sil|sp)$/i.test(normalized)) return ["SP"];
    const romaji = normalized.toLowerCase().replace(/[^a-z]/g, "");
    if (romajiMora[romaji]) return romajiMora[romaji].split(" ");
    const chars = Array.from(normalized);
    const phones = [];
    for (let index = 0; index < chars.length;) {
      const pair = chars.slice(index, index + 2).join("");
      const mora = kanaMora[pair] ? pair : chars[index];
      if (kanaMora[mora]) phones.push(...kanaMora[mora].split(" "));
      else if (/^[a-z]$/i.test(mora) && romajiMora[mora.toLowerCase()]) phones.push(...romajiMora[mora.toLowerCase()].split(" "));
      else if (mora === "ー" && phones.length) phones.push(phones[phones.length - 1]);
      else if (!/[\s,，、.。!?！？]/.test(mora)) return null;
      index += mora.length;
    }
    return phones.length ? phones : null;
  }

  function makeDsTrack(projectTrack, index) {
    const bpm = Math.max(20, Number(projectTrack.bpm) || 120);
    const resolution = Math.max(1, Number(projectTrack.resolution) || 480);
    const rawEvents = [...projectTrack.notes].filter((note) =>
      Number.isFinite(Number(note.startTicks)) && Number(note.startTicks) >= 0 &&
      Number.isFinite(Number(note.durationTicks)) && Number(note.durationTicks) > 0 &&
      Number.isFinite(Number(note.midi)),
    ).sort((left, right) => Number(left.startTicks) - Number(right.startTicks) || Number(left.midi) - Number(right.midi));
    if (!rawEvents.length) throw new Error(`${projectTrack.name}: 歌声ノートがありません`);
    const secondsPerTick = 60 / bpm / resolution;
    const startTime = (note) => Number.isFinite(note.startSeconds) ? note.startSeconds : Number(note.startTicks) * secondsPerTick;
    const durationTime = (note) => Number.isFinite(note.durationSeconds) ? note.durationSeconds : Number(note.durationTicks) * secondsPerTick;
    const events = [];
    let polyphonyAdjusted = false;
    for (const note of rawEvents) {
      const previous = events.at(-1);
      if (previous && startTime(note) < startTime(previous) + durationTime(previous)) {
        polyphonyAdjusted = true;
        const shortenedDuration = startTime(note) - startTime(previous);
        if (shortenedDuration <= 0) {
          events.pop();
        } else if (Number.isFinite(previous.durationSeconds)) {
          previous.durationSeconds = shortenedDuration;
        } else {
          previous.durationTicks = shortenedDuration / secondsPerTick;
        }
      }
      events.push({...note});
    }
    const firstTime = startTime(events[0]);
    const endTime = Math.max(...events.map((note) => startTime(note) + durationTime(note)));
    const noteSeq = [];
    const noteDurations = [];
    const phonemes = [];
    const phoneDurations = [];
    const notePhoneDurations = [];
    const slurFlags = [];
    const texts = [];
    let cursor = firstTime;
    const addNote = (lyric, midi, duration) => {
      if (duration <= 0) return;
      const phones = lyricToPhones(lyric);
      if (!phones) {
        throw new Error(`${projectTrack.name}:「${lyric}」の音素変換に失敗しました。読みをひらがな/ローマ字で指定してください`);
      }
      const pitchName = lyric === "R" || lyric.toLowerCase() === "rest" || phones[0] === "SP"
        ? "rest" : midiToNote(midi);
      noteSeq.push(pitchName);
      noteDurations.push(duration);
      texts.push(lyric);
      const consonants = Math.max(0, phones.length - 1);
      const consonantDuration = Math.min(duration * 0.25, 0.08);
      const vowelDuration = Math.max(0.001, duration - consonantDuration * consonants);
      const split = phones.map((_, phoneIndex) =>
        phoneIndex < consonants ? consonantDuration : vowelDuration);
      const splitTotal = split.reduce((sum, value) => sum + value, 0);
      const normalized = split.map((value) => value * duration / splitTotal);
      phones.forEach((phone, phoneIndex) => {
        phonemes.push(phone);
        phoneDurations.push(normalized[phoneIndex]);
        notePhoneDurations.push(normalized[phoneIndex]);
        slurFlags.push("0");
      });
    };
    for (const note of events) {
      const start = startTime(note);
      if (start > cursor) addNote("R", 60, start - cursor);
      addNote(note.lyric || "あ", Number(note.midi), durationTime(note));
      cursor = Math.max(cursor, start + durationTime(note));
    }
    const totalDuration = endTime - firstTime;
    const timestep = 512 / 44_100;
    const frameCount = Math.max(1, Math.ceil(totalDuration / timestep));
    const f0 = [];
    let activeIndex = 0;
    for (let frame = 0; frame < frameCount; frame++) {
      const elapsedSeconds = frame * timestep + firstTime;
      while (activeIndex < events.length &&
          elapsedSeconds >= startTime(events[activeIndex]) + durationTime(events[activeIndex])) {
        activeIndex++;
      }
      const candidate = events[activeIndex];
      const active = candidate && elapsedSeconds >= startTime(candidate) ? candidate : null;
      const phonesForLyric = active ? lyricToPhones(active.lyric || "あ") : ["SP"];
      const isRest = !active || !phonesForLyric || phonesForLyric[0] === "SP";
      f0.push(isRest ? 0 : 440 * 2 ** ((Number(active.midi) - 69) / 12));
    }
    const segment = {
      offset: firstTime,
      text: texts.join(" "),
      lang: "ja",
      ph_seq: phonemes.join(" "),
      ph_dur: phoneDurations.map((value) => value.toFixed(6)).join(" "),
      ph_num: String(noteSeq.length),
      note_seq: noteSeq.join(" "),
      note_dur: noteDurations.map((value) => value.toFixed(6)).join(" "),
      note_dur_seq: notePhoneDurations.map((value) => value.toFixed(6)).join(" "),
      note_glide: noteSeq.map(() => "none").join(" "),
      note_slur: noteSeq.map(() => "0").join(" "),
      is_slur_seq: slurFlags.join(" "),
      f0_seq: f0.map((value) => value.toFixed(2)).join(" "),
      f0_timestep: timestep,
      gender: f0.map(() => "0.000").join(" "),
      gender_timestep: timestep,
      input_type: "midi",
    };
    return {
      name: projectTrack.name || `Track ${index + 1}`,
      sourceName: `${(projectTrack.name || `track-${index + 1}`).replace(/[\\/:*?"<>|]/g, "_")}.ds`,
      sourceText: JSON.stringify([segment], null, 2),
      mixOffset: Number(projectTrack.mixOffset) || 0,
      gain: Number(projectTrack.gain ?? 1),
      importWarnings: polyphonyAdjusted
        ? ["重なる音符を単旋律に変換しました（同時発音は高い音、重なりは後続音を優先）。"]
        : [],
    };
  }

  async function parseExternalFile(file) {
    const extension = file.name.split(".").at(-1).toLowerCase();
    let data;
    if (extension === "oup") {
      const archive = await unzipProject(await file.arrayBuffer());
      const innerFile = new File([archive.bytes], archive.name.split("/").at(-1), {type: "text/plain"});
      return parseExternalFile(innerFile);
    }
    if (extension === "ust") {
      data = parseUst(await decodeProjectText(file), file.name);
    } else if (extension === "ustx") {
      data = parseUstx(await decodeProjectText(file), file.name);
    } else if (extension === "mid" || extension === "midi") {
      data = parseMidi(await file.arrayBuffer(), file.name);
    } else if (extension === "vsqx") {
      data = parseVsqx(await decodeProjectText(file), file.name);
    } else {
      throw new Error(`未対応のプロジェクト形式です: .${extension}`);
    }
    return {
      tracks: await Promise.all(data.map(async (track, index) => {
        const converted = makeDsTrack(track, index);
        const parsed = await parseTrackSource(converted.sourceName, converted.sourceText);
        return {...converted, inference: parsed.inference};
      })),
      tempo: data[0]?.bpm || 120,
      numerator: data[0]?.numerator || 4,
      denominator: data[0]?.denominator || 4,
      warnings: [],
    };
  }

  async function parseTrackSource(name, sourceText) {
    const response = await fetch("/api/inference", {
      method: "POST",
      headers: {"X-Filename": name},
      body: sourceText,
    });
    const inference = await response.json();
    if (!response.ok) throw new Error(inference.error || `${name}を読み込めません`);
    return {name: name.replace(/\.[^.]+$/, ""), sourceName: name, sourceText, inference};
  }

  async function importEditorFiles(files) {
    if (!files.length) return;
    const appendTracks = state.addingTracks;
    state.addingTracks = false;
    const projectFiles = files.filter((file) => [".dsproj", ".oup"].includes(file.name.slice(file.name.lastIndexOf(".")).toLowerCase()));
    if (projectFiles.length && files.length !== 1) {
      throw new Error(".dsprojは他のファイルと同時に開けません");
    }
    if (projectFiles.length) {
      if (appendTracks) throw new Error("プロジェクトファイルはトラック追加ではなく、新規プロジェクトとして開いてください");
      if (projectFiles[0].name.toLowerCase().endsWith(".oup")) {
        const imported = await parseExternalFile(projectFiles[0]);
        applyProjectSettings({tempo: imported.tempo, time_signature: [imported.numerator, imported.denominator]});
        clearBgmData();
        setProjectTracks(imported.tracks);
        $("#record-list").querySelectorAll(".record-button").forEach((button) => button.classList.remove("active"));
        renderInference();
        renderProjectTracks();
        const warnings = imported.tracks.flatMap((track) => track.importWarnings || []);
        if (warnings.length) $("#synthesis-help").textContent = warnings.join(" ");
        return;
      }
      const project = JSON.parse(await projectFiles[0].text());
      if (project.format !== "diffsinger-web-editor" || project.version !== 1 || !Array.isArray(project.tracks)) {
        throw new Error("未対応または不正なWeb Editorプロジェクトです");
      }
      const tracks = await Promise.all(project.tracks.map((track) => {
        if (typeof track.source_text !== "string" || !track.source_text) {
          throw new Error("プロジェクトにDSトラックデータがありません");
        }
        return parseTrackSource(track.source_name || `${track.name || "track"}.ds`, track.source_text)
          .then((parsed) => ({
            ...parsed,
            name: String(track.name || parsed.name),
            mixOffset: Number(track.mix_offset) || 0,
            gain: Number(track.gain ?? 1),
          }));
      }));
      applyProjectSettings(project);
      clearBgmData();
      if (project.bgm?.data_base64) {
        await setBgmData(
          project.bgm.name || "BGM",
          base64ToArrayBuffer(project.bgm.data_base64),
          project.bgm.mime_type || "audio/wav",
          project.bgm.offset,
          project.bgm.gain,
        );
      }
      setProjectTracks(tracks);
    } else if (files.some((file) => file.name.toLowerCase().endsWith(".lab"))) {
      if (appendTracks) throw new Error(".labファイルはトラックとして追加できません");
      if (files.length !== 1) throw new Error(".lab表示とDS複数トラックの同時読み込みには対応していません");
      const file = files[0];
      const sourceText = await file.text();
      const response = await fetch("/api/inference", {
        method: "POST",
        headers: {"X-Filename": file.name},
        body: sourceText,
      });
      const inference = await response.json();
      if (!response.ok) throw new Error(inference.error || "ファイルを読み込めません");
      stopTransport();
      resetSynthesisState();
      clearInferenceAudio();
      state.projectTracks = [];
      state.sourceName = file.name;
      state.sourceText = sourceText;
      state.inference = inference;
      state.active = -1;
      updatePredictButton();
      renderProjectTracks();
    } else {
      const tracks = [];
      let projectSettings = null;
      for (const file of files) {
        const extension = file.name.slice(file.name.lastIndexOf(".")).toLowerCase();
        if ([".ds", ".json"].includes(extension)) {
          tracks.push(await parseTrackSource(file.name, await decodeProjectText(file)));
        } else {
          const imported = await parseExternalFile(file);
          tracks.push(...imported.tracks);
          if (!projectSettings) projectSettings = {
            tempo: imported.tempo,
            time_signature: [imported.numerator, imported.denominator],
          };
        }
      }
      if (!appendTracks || !state.projectTracks.length) {
        applyProjectSettings(projectSettings || {tempo: 120, time_signature: [4, 4]});
      }
      if (appendTracks && state.projectTracks.length) {
        syncActiveTrack();
        const newTrackIndex = state.projectTracks.length;
        setProjectTracks([...state.projectTracks, ...tracks]);
        state.activeTrackIndex = newTrackIndex;
        state.sourceName = state.projectTracks[newTrackIndex].sourceName;
        state.sourceText = state.projectTracks[newTrackIndex].sourceText;
        state.inference = state.projectTracks[newTrackIndex].inference;
        state.segment = 0;
        updatePredictButton();
      } else {
        clearBgmData();
        setProjectTracks(tracks);
      }
    }
    $("#record-list").querySelectorAll(".record-button").forEach((button) => button.classList.remove("active"));
    if (state.inference) renderInference();
    renderProjectTracks();
    const warnings = state.projectTracks.flatMap((track) => track.importWarnings || []);
    if (warnings.length) $("#synthesis-help").textContent = warnings.join(" ");
  }

  function updatePredictButton() {
    const button = $("#predict-duration");
    if (!button) return;
    const unsupported = unsupportedPhones();
    button.disabled = !state.sourceText || !/\.(ds|json)$/i.test(state.sourceName) || !state.models.length || unsupported.length > 0;
    const status = $("#inference-status");
    if (status && unsupported.length) status.textContent = `未学習の音素があります: ${unsupported.join(" ")}`;
    else if (status && untrainedPhones().length) status.textContent = `教師例のない音素を含みます: ${untrainedPhones().join(" ")}`;
    updateSynthesisButton();
  }

  function canSynthesizeInput() {
    if (!state.sourceText || !/\.(ds|json)$/i.test(state.sourceName)) return false;
    try {
      const data = JSON.parse(state.sourceText);
      const segments = Array.isArray(data) ? data : (data.segments || [data]);
      return segments.length > 0 && segments.every((segment) =>
        segment.ph_seq && segment.ph_dur && segment.f0_seq && segment.f0_timestep);
    } catch { return false; }
  }

  function updateSynthesisButton() {
    const button = $("#synthesize");
    const allButton = $("#synthesize-all");
    const select = $("#acoustic-model-select");
    const help = $("#synthesis-help");
    if (!button || !allButton || !select || !help) return;
    const model = state.synthesisModels.find((item) => item.experiment === select.value);
    const speakerLabel = $("#speaker-label");
    const speakerSelect = $("#speaker-select");
    const selectedSpeaker = speakerSelect.value;
    const speakers = model?.speakers || [];
    speakerSelect.innerHTML = `<option value="">DSの指定を使う</option>${speakers.map((speaker) => `<option value="${escapeHtml(speaker)}">${escapeHtml(speaker)}</option>`).join("")}`;
    if (speakers.includes(selectedSpeaker)) speakerSelect.value = selectedSpeaker;
    speakerLabel.classList.toggle("hidden", !model?.speakers?.length);
    speakerSelect.classList.toggle("hidden", !model?.speakers?.length);
    const needsSpeaker = model?.requires_speaker && speakers.length > 1;
    const dsHasSpeakerMix = (() => {
      try {
        const data = JSON.parse(state.sourceText);
        const segments = Array.isArray(data) ? data : (data.segments || [data]);
        return segments.every((segment) => segment.spk_mix && Object.keys(segment.spk_mix).length);
      } catch { return false; }
    })();
    const speakerMissing = needsSpeaker && !speakerSelect.value && !dsHasSpeakerMix;
    button.disabled = !model || !canSynthesizeInput() || speakerMissing;
    allButton.disabled = !model || !state.projectTracks.length ||
      state.projectTracks.some((track) => !track.sourceText || !/\.(ds|json)$/i.test(track.sourceName)) ||
      speakerMissing;
    if (!state.synthesisModels.length) {
      help.textContent = "音声合成には音響checkpointとvocoderが必要です。DiffSinger/checkpointsに配置してください。";
    } else if (!state.sourceText || !/\.(ds|json)$/i.test(state.sourceName)) {
      help.textContent = "合成する .ds / .json を読み込んでください。";
    } else if (!canSynthesizeInput()) {
      help.textContent = "ph_dur・f0_seq・f0_timestepが必要です。duration未指定なら先にDurationを予測してください。";
    } else if (speakerMissing) {
      help.textContent = "複数歌手モデルです。歌声を選択するか、.dsにspk_mixを指定してください。";
    } else {
      help.textContent = "表示中のDS音素とノート、音高を使ってWAVを生成します。";
    }
  }

  function setInferenceAudio(url, generated = false) {
    if (transportAudio) stopTransport();
    if (state.audioUrl.startsWith("blob:")) URL.revokeObjectURL(state.audioUrl);
    state.audioUrl = url;
    state.generatedAudio = generated;
    if (state.inference?.segments?.[state.segment || 0] && $("#arrangement-wave")) {
      drawArrangement();
    }
  }

  function clearInferenceAudio() {
    stopTransport();
    setInferenceAudio("");
  }

  function resetSynthesisState() {
    if (state.synthesisJobId) {
      fetch(`/api/synthesis-cancel?job=${encodeURIComponent(state.synthesisJobId)}`, {method: "POST"})
        .then((response) => {
          if (!response.ok) console.error("Could not cancel synthesis job");
        })
        .catch((error) => console.error("Could not cancel synthesis job:", error));
    }
    state.synthesisJobId = "";
    state.synthesisRunning = false;
    state.synthesisLogs = [];
    state.synthesisTotal = 0;
    state.synthesisCompleted = 0;
  }

  function drawLiveSpectrum() {
    const playback = state.livePlayback;
    if (!playback) return;
    const canvas = $("#live-spectrogram");
    if (!canvas) {
      playback.frame = requestAnimationFrame(drawLiveSpectrum);
      return;
    }
    const width = canvas.clientWidth || 500;
    const height = canvas.clientHeight || 140;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    const context = canvas.getContext("2d");
    const bins = playback.analyser.frequencyBinCount;
    const frequencies = new Uint8Array(bins);
    playback.analyser.getByteFrequencyData(frequencies);
    context.drawImage(canvas, 1, 0, width - 1, height, 0, 0, width - 1, height);
    const maxBin = Math.min(bins - 1, Math.floor(8000 * playback.audioContext.sampleRate / playback.analyser.fftSize));
    for (let y = 0; y < height; y++) {
      const bin = Math.min(maxBin, Math.max(1, Math.round((1 - y / height) * maxBin)));
      const level = frequencies[bin] / 255;
      context.fillStyle = `rgb(${Math.round(18 + 237 * level)},${Math.round(44 + 167 * Math.sin(level * Math.PI / 2))},${Math.round(51 + 95 * (1 - level))})`;
      context.fillRect(width - 1, y, 1, 1);
    }
    playback.frame = requestAnimationFrame(drawLiveSpectrum);
  }

  async function prepareLivePlayback() {
    if (state.livePlayback) {
      cancelAnimationFrame(state.livePlayback.frame);
      await state.livePlayback.audioContext.close();
    }
    const audioContext = new AudioContext();
    await audioContext.resume();
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.25;
    analyser.connect(audioContext.destination);
    state.livePlayback = {
      audioContext,
      analyser,
      baseTime: 0,
      firstOffset: 0,
      nextTime: 0,
      sources: new Set(),
      stopped: false,
      frame: requestAnimationFrame(drawLiveSpectrum),
    };
  }

  async function queueLiveSegment(blob, segment) {
    const playback = state.livePlayback;
    if (!playback || playback.stopped) return;
    const audioBuffer = await playback.audioContext.decodeAudioData(await blob.arrayBuffer());
    if (playback.stopped || state.livePlayback !== playback) return;
    const source = playback.audioContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(playback.analyser);
    playback.sources.add(source);
    source.addEventListener("ended", () => playback.sources.delete(source), {once: true});
    const offset = Number(segment.offset) || 0;
    if (!playback.baseTime) {
      playback.baseTime = playback.audioContext.currentTime + 0.05;
      playback.firstOffset = offset;
    }
    const startTime = Math.max(
      playback.audioContext.currentTime + 0.03,
      playback.nextTime,
      playback.baseTime + Math.max(0, offset - playback.firstOffset),
    );
    playback.nextTime = startTime + audioBuffer.duration;
    source.start(startTime);
  }

  function updateSynthesisMonitor() {
    const log = $("#synthesis-log");
    const progress = $("#synthesis-progress");
    const label = $("#synthesis-progress-label");
    if (log) {
      log.textContent = state.synthesisLogs.join("\n");
      log.scrollTop = log.scrollHeight;
    }
    if (progress) {
      progress.max = state.synthesisTotal || 1;
      progress.value = state.synthesisCompleted;
    }
    if (label) label.textContent = state.synthesisRunning ? "処理中" : "完了";
  }

  function unsupportedPhones() {
    const model = state.models.find((item) => item.experiment === $("#model-select").value);
    if (!model || !state.inference) return [];
    const supported = new Set(model.phonemes || []);
    return [...new Set(state.inference.segments.flatMap((segment) => segment.phonemes.map((phone) => phone.phoneme))) ]
      .filter((phone) => !supported.has(phone));
  }

  function untrainedPhones() {
    const model = state.models.find((item) => item.experiment === $("#model-select").value);
    if (!model || !state.inference) return [];
    const untrained = new Set(model.untrained_phonemes || []);
    return [...new Set(state.inference.segments.flatMap((segment) => segment.phonemes.map((phone) => phone.phoneme))) ]
      .filter((phone) => untrained.has(phone));
  }

  async function runDurationPrediction() {
    const button = $("#predict-duration");
    const status = $("#inference-status");
    if (!state.sourceText || !state.models.length) return;
    button.disabled = true;
    button.textContent = "推論中...";
    if (status) status.textContent = "学習済みモデルでDurationを計算しています";
    try {
      const response = await fetch("/api/predict-duration", {
        method: "POST",
        headers: {
          "X-Filename": state.sourceName,
          "X-Model": $("#model-select").value,
        },
        body: state.sourceText,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "推論に失敗しました");
      clearInferenceAudio();
      state.inference = data;
      state.sourceText = data.source;
      syncActiveTrack();
      renderInference();
      if (status) {
        const checkpoint = data.checkpoint == null ? "事前学習済み" : `step ${data.checkpoint}`;
        status.textContent = `${data.model} / ${checkpoint} · 句頭補正 ${data.calibrated_leading_count}件`;
      }
    } catch (error) {
      if (status) status.textContent = error.message;
    } finally {
      button.textContent = "Durationを予測";
      updatePredictButton();
    }
  }

  async function mixAudioBlobs(items) {
    const decoder = new AudioContext({sampleRate: 44_100});
    try {
      const decoded = [];
      for (const item of items) {
        const buffer = await decoder.decodeAudioData(await item.blob.arrayBuffer());
        decoded.push({...item, buffer});
      }
      if (!decoded.length) throw new Error("ミックスする音声がありません");
      const sampleRate = decoder.sampleRate;
      const duration = Math.max(...decoded.map((item) =>
        Math.max(0, Number(item.offset) || 0) + item.buffer.duration));
      const frameCount = Math.ceil(duration * sampleRate);
      const left = new Float32Array(frameCount);
      const right = new Float32Array(frameCount);
      for (const item of decoded) {
        const start = Math.round(Math.max(0, Number(item.offset) || 0) * sampleRate);
        const gain = Math.max(0, Number(item.gain) || 0);
        const source = item.buffer;
        const channels = Array.from({length: source.numberOfChannels}, (_, channel) => source.getChannelData(channel));
        const length = Math.min(frameCount - start, Math.ceil(source.length * sampleRate / source.sampleRate));
        for (let frame = 0; frame < length; frame++) {
          const position = frame * source.sampleRate / sampleRate;
          const index = Math.floor(position);
          const fraction = position - index;
          const next = Math.min(source.length - 1, index + 1);
          const sample = (channel) => {
            const data = channels[Math.min(channel, channels.length - 1)];
            return (data[index] * (1 - fraction) + data[next] * fraction) * gain;
          };
          left[start + frame] += sample(0);
          right[start + frame] += channels.length > 1 ? sample(1) : sample(0);
        }
      }
      let peak = 0;
      for (let index = 0; index < frameCount; index++) peak = Math.max(peak, Math.abs(left[index]), Math.abs(right[index]));
      const scale = peak > 0.98 ? 0.98 / peak : 1;
      const output = new ArrayBuffer(44 + frameCount * 4);
      const view = new DataView(output);
      const write = (offset, value) => {
        for (let index = 0; index < value.length; index++) view.setUint8(offset + index, value.charCodeAt(index));
      };
      write(0, "RIFF");
      view.setUint32(4, 36 + frameCount * 4, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 2, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 4, true);
      view.setUint16(32, 4, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, frameCount * 4, true);
      for (let frame = 0; frame < frameCount; frame++) {
        const index = 44 + frame * 4;
        view.setInt16(index, Math.max(-1, Math.min(1, left[frame] * scale)) * 32767, true);
        view.setInt16(index + 2, Math.max(-1, Math.min(1, right[frame] * scale)) * 32767, true);
      }
      return new Blob([output], {type: "audio/wav"});
    } finally {
      await decoder.close();
    }
  }

  async function synthesizeTrack(track, model, speaker, completedBefore, totalSegments) {
    const response = await fetch("/api/synthesize", {
      method: "POST",
      headers: {
        "X-Filename": track.sourceName,
        "X-Model": model.experiment,
        "X-Checkpoint": String(model.checkpoint ?? ""),
        "X-Speaker": speaker,
      },
      body: track.sourceText,
    });
    const job = await response.json();
    if (!response.ok) throw new Error(job.error || `${track.name}の合成を開始できません`);
    state.synthesisJobId = job.job_id;
    let playedSegments = 0;
    let finished = false;
    while (!finished) {
      const statusResponse = await fetch(`/api/synthesis-status?job=${encodeURIComponent(job.job_id)}`);
      const progress = await statusResponse.json();
      if (!statusResponse.ok) throw new Error(progress.error || "合成ジョブの状態を取得できません");
      state.synthesisLogs = (progress.logs || []).map((line) => `${track.name}: ${line}`);
      state.synthesisTotal = totalSegments;
      state.synthesisCompleted = completedBefore + (progress.segments || []).length;
      updateSynthesisMonitor();
      while (playedSegments < state.synthesisCompleted - completedBefore) {
        const segment = progress.segments[playedSegments];
        const audioResponse = await fetch(`/api/synthesis-segment?job=${encodeURIComponent(job.job_id)}&index=${segment.index}`);
        if (!audioResponse.ok) throw new Error(`${track.name}: 合成フレーズの音声を取得できません`);
        await queueLiveSegment(await audioResponse.blob(), {
          ...segment,
          offset: (Number(track.mixOffset) || 0) + Number(segment.offset || 0),
        });
        playedSegments++;
      }
      if (progress.status === "failed") throw new Error(progress.error || `${track.name}の合成に失敗しました`);
      if (progress.status === "cancelled") throw new Error(`${track.name}の合成はキャンセルされました`);
      finished = progress.status === "completed";
      if (!finished) await new Promise((resolve) => setTimeout(resolve, 400));
    }
    const audioResponse = await fetch(`/api/synthesis-audio?job=${encodeURIComponent(job.job_id)}`);
    if (!audioResponse.ok) throw new Error(`${track.name}: 合成WAVを取得できません`);
    state.synthesisJobId = "";
    return await audioResponse.blob();
  }

  async function remixCachedTracks() {
    const status = $("#synthesis-help");
    const mixItems = state.projectTracks
      .filter((track) => track.synthesisBlob)
      .map((track) => ({
        blob: track.synthesisBlob,
        offset: Number(track.mixOffset) || 0,
        gain: Number(track.gain ?? 1),
      }));
    if (!mixItems.length) {
      status.textContent = "先に歌声トラックを合成してください";
      return;
    }
    if (state.bgm) {
      mixItems.push({
        blob: new Blob([state.bgm.bytes], {type: state.bgm.mimeType}),
        offset: Number(state.bgm.offset) || 0,
        gain: Number(state.bgm.gain ?? 0.7),
      });
    }
    const button = $("#remix-arrangement");
    button.disabled = true;
    try {
      const mixed = await mixAudioBlobs(mixItems);
      setInferenceAudio(URL.createObjectURL(mixed), true);
      renderInference();
      status.textContent = `${mixItems.length}音源を再ミックスしました。WAVを再生または保存できます。`;
    } catch (error) {
      status.textContent = `ミックスに失敗しました: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  }

  async function runSynthesis(allTracks = false) {
    const button = allTracks ? $("#synthesize-all") : $("#synthesize");
    const status = $("#synthesis-help");
    const model = state.synthesisModels.find((item) => item.experiment === $("#acoustic-model-select").value);
    if (!model || (!allTracks && !canSynthesizeInput())) return;
    const tracks = allTracks
      ? [...state.projectTracks]
      : [state.projectTracks[state.activeTrackIndex]].filter(Boolean);
    if (!tracks.length) return;
    if (tracks.some((track) => !track.sourceText || !/\.(ds|json)$/i.test(track.sourceName))) {
      status.textContent = "すべてのトラックをDS音源に変換してから合成してください";
      return;
    }
    button.disabled = true;
    button.textContent = "合成中...";
    state.synthesisRunning = true;
    state.synthesisLogs = [];
    state.synthesisCompleted = 0;
    state.synthesisTotal = tracks.reduce((sum, track) => sum + track.inference.segments.length, 0);
    renderInference();
    status.textContent = `${tracks.length}トラックを順に合成し、位置・音量を合わせてミックスします。`;
    try {
      await prepareLivePlayback();
      const speaker = $("#speaker-select").value;
      let completedBefore = 0;
      for (const track of tracks) {
        track.synthesisBlob = await synthesizeTrack(track, model, speaker, completedBefore, state.synthesisTotal);
        completedBefore += track.inference.segments.length;
      }
      const mixItems = state.projectTracks
        .filter((track) => track.synthesisBlob)
        .map((track) => ({
          blob: track.synthesisBlob,
          offset: Number(track.mixOffset) || 0,
          gain: Number(track.gain ?? 1),
        }));
      if (state.bgm) {
        mixItems.push({
          blob: new Blob([state.bgm.bytes], {type: state.bgm.mimeType}),
          offset: Number(state.bgm.offset) || 0,
          gain: Number(state.bgm.gain ?? 0.7),
        });
      }
      const mixed = await mixAudioBlobs(mixItems);
      setInferenceAudio(URL.createObjectURL(mixed), true);
      state.synthesisJobId = "";
      state.synthesisRunning = false;
      renderInference();
      status.textContent = `${tracks.length}トラック${state.bgm ? " + BGM" : ""}をミックスしました。WAVを再生または保存できます。`;
    } catch (error) {
      if (state.synthesisJobId) resetSynthesisState();
      state.synthesisRunning = false;
      state.synthesisLogs.push(`エラー: ${error.message}`);
      renderInference();
      status.textContent = error.message;
    } finally {
      button.textContent = allTracks ? "全歌声トラックを合成・ミックス" : "選択トラックを合成";
      updateSynthesisButton();
    }
  }

  $("#training-mode").addEventListener("click", () => setMode("training"));
  $("#inference-mode").addEventListener("click", () => setMode("inference"));
  $("#inference-file").addEventListener("change", async (event) => {
    try {
      await importEditorFiles(Array.from(event.target.files || []));
    } catch (error) {
      $("#detail").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    } finally {
      state.addingTracks = false;
      event.target.value = "";
    }
  });
  $("#inference-file").addEventListener("click", (event) => {
    if (event.isTrusted) state.addingTracks = false;
  });
  $("#add-track").addEventListener("click", () => {
    state.addingTracks = true;
    $("#inference-file").click();
  });
  $("#inference-audio").addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;
    setInferenceAudio(URL.createObjectURL(file));
    if (state.inference) renderInference();
  });
  $("#predict-duration").addEventListener("click", runDurationPrediction);
  $("#synthesize").addEventListener("click", () => runSynthesis(false));
  $("#synthesize-all").addEventListener("click", () => runSynthesis(true));
  $("#bgm-file").addEventListener("change", async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    try {
      await loadBgmFile(file);
      $("#synthesis-help").textContent = `BGMを読み込みました: ${file.name}`;
    } catch (error) {
      $("#synthesis-help").textContent = `BGMを読み込めません: ${error.message}`;
    } finally {
      event.target.value = "";
    }
  });
  $("#save-project").addEventListener("click", saveProject);
  $("#model-select").addEventListener("change", () => {
    updatePredictButton();
    if (state.inference) renderInference();
  });
  $("#acoustic-model-select").addEventListener("change", updateSynthesisButton);
  document.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      event.preventDefault();
      saveProject();
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z" && !event.target.matches("input, textarea")) {
      event.preventDefault();
      restoreEdit(!event.shiftKey);
    }
  });

  async function init() {
    try {
      const [trainingResponse, samplesResponse, modelsResponse] = await Promise.all([
        fetch("/api/training"), fetch("/api/inference-samples"), fetch("/api/models"),
      ]);
      const training = await trainingResponse.json();
      const samples = await samplesResponse.json();
      const models = await modelsResponse.json();
      if (!trainingResponse.ok) throw new Error(training.error || "教師データを読み込めません");
      state.training = training.records;
      state.inferenceSamples = samples.samples || [];
      state.models = models.models || [];
      state.synthesisModels = models.synthesis_models || [];
      $("#training-mode").setAttribute("aria-pressed", "false");
      $("#inference-mode").setAttribute("aria-pressed", "true");
      $("#list-title").textContent = "推論サンプル";
      $("#upload-box").classList.remove("hidden");
      $("#model-select").innerHTML = state.models.length
        ? state.models.map((model) => `<option value="${escapeHtml(model.experiment)}">${escapeHtml(model.label || `${model.experiment} · step ${model.checkpoint}`)}</option>`).join("")
        : '<option value="">学習済みモデルがありません</option>';
      $("#acoustic-model-select").innerHTML = state.synthesisModels.length
        ? state.synthesisModels.map((model) => `<option value="${escapeHtml(model.experiment)}">${escapeHtml(model.label)}</option>`).join("")
        : '<option value="">音声合成モデルがありません</option>';
      updatePredictButton();
      renderList();
      if (state.inferenceSamples.length) {
        state.active = 0;
        await loadInferenceSample(state.inferenceSamples[0]);
        renderList();
      }
    } catch (error) { $("#detail").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`; }
  }
  init();
</script>
