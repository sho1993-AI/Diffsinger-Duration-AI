<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音素ビューア・合成 | DiffSinger</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a31;
      --muted: #65747a;
      --paper: #f3f6f2;
      --line: #d7dfd9;
      --teal: #137b72;
      --teal-soft: #dceee9;
      --coral: #d55e4f;
      --yellow: #f0c46b;
      --surface: #fffefa;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    button, select, input { font: inherit; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px clamp(18px, 4vw, 56px); border-bottom: 1px solid var(--line); background: rgba(255,254,250,.88); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--teal); font: 700 15px Georgia, serif; }
    .brand-title { font: 600 18px Georgia, "Yu Mincho", serif; letter-spacing: 0; }
    .brand-sub { margin-top: 3px; color: var(--muted); font: 11px var(--mono); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 12px var(--mono); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4a9b70; }
    main { max-width: 1440px; margin: 0 auto; padding: 34px clamp(16px, 4vw, 56px) 60px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
    h1 { margin: 0; font: 500 clamp(26px, 3vw, 38px)/1.15 Georgia, "Yu Mincho", serif; letter-spacing: 0; }
    .intro p { max-width: 560px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .mode-switch { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: #e9eee9; flex: 0 0 auto; }
    .mode-switch button { padding: 9px 15px; border: 0; border-radius: 4px; color: var(--muted); background: transparent; cursor: pointer; font-size: 13px; }
    .mode-switch button[aria-pressed="true"] { color: #fff; background: var(--ink); }
    .workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 580px; border: 1px solid var(--line); background: var(--surface); }
    aside { padding: 20px 16px; border-right: 1px solid var(--line); background: #f9faf6; }
    .side-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 0 3px 13px; font-size: 12px; font-weight: 700; }
    .count { color: var(--muted); font: 11px var(--mono); }
    .record-list { display: grid; gap: 5px; }
    .record-button { display: grid; gap: 6px; width: 100%; padding: 12px 11px; border: 1px solid transparent; border-radius: 4px; color: var(--ink); background: transparent; text-align: left; cursor: pointer; }
    .record-button:hover { background: #edf3ee; }
    .record-button.active { border-color: #b6d6cc; background: var(--teal-soft); }
    .record-name { overflow-wrap: anywhere; font: 12px var(--mono); }
    .record-meta { color: var(--muted); font-size: 11px; }
    .upload-box { margin-top: 18px; padding: 13px; border: 1px dashed #aab9b1; border-radius: 4px; background: var(--surface); }
    .upload-box label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
    .upload-box input { width: 100%; color: var(--muted); font-size: 11px; }
    .upload-box select { width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 3px; background: white; font-size: 11px; }
    .upload-box button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 3px; color: white; background: var(--teal); cursor: pointer; font-size: 12px; }
    .upload-box button:disabled { opacity: .45; cursor: not-allowed; }
    .upload-box p { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .content { min-width: 0; padding: 24px clamp(16px, 3vw, 36px) 32px; }
    .content-head { display: flex; align-items: start; justify-content: space-between; gap: 15px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; overflow-wrap: anywhere; font: 500 23px Georgia, "Yu Mincho", serif; letter-spacing: 0; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .stats { display: flex; gap: 17px; flex: 0 0 auto; }
    .stat { display: grid; gap: 4px; text-align: right; }
    .stat span { color: var(--muted); font-size: 10px; }
    .stat strong { font: 600 16px var(--mono); }
    .section-label { display: flex; justify-content: space-between; gap: 12px; margin: 22px 0 9px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .axis { display: flex; justify-content: space-between; padding: 0 1px 5px; color: #7c898a; font: 10px var(--mono); }
    .timeline { display: flex; position: relative; width: 100%; min-height: 48px; overflow: hidden; border: 1px solid #d5ddd7; border-radius: 3px; background: #edf1ed; }
    .phone { display: flex; position: relative; z-index: 1; flex-direction: column; justify-content: center; min-width: 0; padding: 5px 3px; overflow: hidden; border-right: 1px solid rgba(32,42,49,.16); color: #193d3a; background: var(--teal-soft); text-align: center; }
    .boundary-line { position: absolute; z-index: 2; top: 0; bottom: 0; width: 1px; background: var(--coral); box-shadow: 0 0 0 1px rgba(255,255,255,.55); pointer-events: none; }
    .phone:nth-child(4n+2) { background: #e8eee1; }
    .phone:nth-child(4n+3) { background: #f7e9cc; color: #564223; }
    .phone:nth-child(4n) { background: #f3ded7; color: #633d36; }
    .phone b { overflow: hidden; font: 600 11px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .phone small { margin-top: 3px; overflow: hidden; font: 9px var(--mono); text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
    .note-track { margin-top: 8px; min-height: 34px; border-color: #e5d7b8; }
    .note-track .phone { color: #5a492b; background: #f7edda; }
    .audio-row { display: flex; align-items: center; gap: 13px; margin-top: 13px; }
    audio { width: min(390px, 100%); height: 34px; }
    .wave { width: 100%; height: 46px; }
    .spectrogram { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 3px; background: #17272a; }
    .time-axis { display: flex; justify-content: space-between; padding-top: 5px; color: #7c898a; font: 10px var(--mono); }
    .inference-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; }
    .inference-actions audio { flex: 0 1 330px; }
    .inference-actions a { color: var(--teal); font-size: 12px; }
    .run-status { color: var(--muted); font-size: 11px; }
    .synthesis-monitor { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 3px; background: #f8faf7; }
    .synthesis-monitor progress { width: 100%; height: 8px; accent-color: var(--teal); }
    .live-spectrogram { display: block; width: 100%; height: 140px; margin-top: 8px; border-radius: 3px; background: #17272a; }
    .synthesis-log { max-height: 120px; margin: 8px 0 0; overflow: auto; color: var(--muted); font: 10px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .table-wrap { margin-top: 19px; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 3px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; color: var(--muted); background: #f3f6f2; font-size: 10px; font-weight: 700; text-align: left; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e8ece8; white-space: nowrap; }
    td.num { font-family: var(--mono); text-align: right; }
    td.phone-cell { font: 600 12px var(--mono); }
    tr:last-child td { border-bottom: 0; }
    .empty, .error { padding: 30px 12px; color: var(--muted); text-align: center; font-size: 13px; }
    .error { color: #a33e34; }
    .notice { margin-top: 12px; color: #936c20; font-size: 11px; }
    .track-list { display: grid; gap: 4px; margin: 8px 0 14px; }
    .project-track { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .project-track .track-button { min-width: 0; flex: 1 1 auto; }
    .project-track .track-button > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-remove { width: 25px; height: 27px; padding: 0; border: 0; border-radius: 3px; color: var(--muted); background: transparent; cursor: pointer; }
    .track-remove:hover { color: #a33e34; background: #f3ded7; }
    .track-button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 3px; color: var(--ink); background: transparent; text-align: left; cursor: pointer; font-size: 11px; }
    .track-button.active { border-color: #b6d6cc; background: var(--teal-soft); }
    .track-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 2px; background: var(--teal); }
    .editor { margin-top: 22px; border: 1px solid var(--line); background: #fbfcfa; }
    .editor-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 9px; border-bottom: 1px solid var(--line); background: #f1f5f1; }
    .editor-toolbar button, .editor-toolbar select, .editor-toolbar input { min-height: 30px; padding: 5px 8px; border: 1px solid #cbd5ce; border-radius: 3px; color: var(--ink); background: white; font-size: 11px; }
    .editor-toolbar button { cursor: pointer; }
    .editor-toolbar button[aria-pressed="true"] { border-color: var(--teal); color: #fff; background: var(--teal); }
    .editor-toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .editor-toolbar .tool-spacer { flex: 1 1 auto; }
    .editor-toolbar .editor-number { width: 58px; }
    .piano-scroll { max-width: 100%; overflow: auto; overscroll-behavior: contain; }
    #piano-roll { display: block; min-width: 100%; height: 520px; background: #fff; cursor: crosshair; touch-action: none; }
    .editor-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .lyrics-editor { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(180px, 2fr) auto; align-items: end; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    .lyrics-editor label { display: grid; gap: 4px; color: var(--muted); font-size: 10px; }
    .lyrics-editor input { min-width: 0; padding: 7px; border: 1px solid var(--line); border-radius: 3px; font: 11px var(--mono); }
    .lyrics-editor button { min-height: 31px; padding: 6px 10px; border: 0; border-radius: 3px; color: white; background: var(--teal); cursor: pointer; font-size: 11px; }
    .transport { display: flex; align-items: center; gap: 5px; }
    .transport button { min-width: 32px; font-weight: 700; }
    .editor-status { color: var(--muted); }
    .arrangement { margin-top: 16px; border: 1px solid var(--line); background: #f9fbf8; }
    .arrangement-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700; }
    .arrangement-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .arrangement-controls label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .arrangement-controls input { width: 76px; padding: 5px; border: 1px solid var(--line); border-radius: 3px; }
    .arrangement-controls button { padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; background: white; cursor: pointer; font-size: 10px; }
    .arrangement-scroll { max-width: 100%; overflow: auto; }
    #arrangement-wave { display: block; min-width: 100%; height: 190px; background: #fff; touch-action: none; }
    .arrangement-help { padding: 6px 10px; color: var(--muted); font-size: 10px; }
    .hidden { display: none !important; }
    @media (max-width: 760px) {
      .topbar { padding: 13px 16px; }
      .status { font-size: 10px; }
      main { padding-top: 23px; }
      .intro { align-items: start; flex-direction: column; }
      .mode-switch { align-self: stretch; }
      .mode-switch button { flex: 1; }
      .workspace { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .record-list { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .content-head { flex-direction: column; }
      .stats { align-self: stretch; justify-content: start; }
      .stat { text-align: left; }
      .phone b { font-size: 9px; }
      .phone small { font-size: 8px; }
      .lyrics-editor { grid-template-columns: 1fr; }
      #piano-roll { height: 420px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">音</div><div><div class="brand-title">DiffSinger Studio</div><div class="brand-sub">WEB VOICE EDITOR</div></div></div>
    <div class="status">LOCAL DATA</div>
  </header>
  <main>
    <div class="intro">
      <div><h1>歌声を、編集して合成。</h1><p>DSプロジェクト、トラック、ピアノロール、音素編集、リアルタイム合成をひとつの画面で扱えます。</p></div>
      <div class="mode-switch" role="group" aria-label="データ種別">
        <button id="training-mode" aria-pressed="false">教師データ</button>
        <button id="inference-mode" aria-pressed="true">推論・合成</button>
      </div>
    </div>
    <div class="workspace">
      <aside>
        <div class="side-heading"><span id="list-title">学習録音</span><span class="count" id="list-count">...</span></div>
        <div class="record-list" id="record-list"><div class="empty">読み込み中</div></div>
        <div class="upload-box hidden" id="upload-box">
          <label for="inference-file">プロジェクト / 歌声トラックを開く</label>
          <input id="inference-file" type="file" accept=".ds,.json,.dsproj,.lab,.ust,.ustx,.mid,.midi,.vsqx,.oup" multiple>
          <button id="add-track" type="button">＋トラックを追加</button>
          <label for="bgm-file" style="margin-top:13px">BGM / ガイド音源</label>
          <input id="bgm-file" type="file" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a">
          <div class="track-list" id="track-list" aria-label="プロジェクトトラック"></div>
          <button id="save-project" type="button" disabled>プロジェクトを保存</button>
          <label for="model-select" style="margin-top:13px">学習済みDurationモデル</label>
          <select id="model-select"><option>読み込み中</option></select>
          <button id="predict-duration" type="button" disabled>Durationを予測</button>
          <div class="run-status" id="inference-status" aria-live="polite"></div>
          <label for="acoustic-model-select" style="margin-top:13px">音声合成モデル</label>
          <select id="acoustic-model-select"><option>読み込み中</option></select>
          <label for="speaker-select" id="speaker-label" style="margin-top:10px">歌声</label>
          <select id="speaker-select"></select>
          <button id="synthesize" type="button" disabled>選択トラックを合成</button>
          <button id="synthesize-all" type="button" disabled>全歌声トラックを合成・ミックス</button>
          <div class="run-status" id="synthesis-help" aria-live="polite"></div>
          <label for="inference-audio" style="margin-top:14px">推論WAV / 合成済みWAV</label>
          <input id="inference-audio" type="file" accept="audio/wav,.wav">
          <p>.dsのph_seqを音素一覧・タイムラインに表示します。Duration推論後、音響モデルとvocoderがあればWAVを合成できます。</p>
        </div>
      </aside>
      <section class="content" id="detail"><div class="empty">データを読み込んでいます...</div></section>
    </div>
  </main>
<script>
  const state = {
    mode: "inference",
    training: [],
    inferenceSamples: [],
    models: [],
    synthesisModels: [],
    inference: null,
    sourceText: "",
    sourceName: "",
    audioUrl: "",
    generatedAudio: false,
    active: 0,
    projectTracks: [],
    activeTrackIndex: 0,
    addingTracks: false,
    bgm: null,
    mixerOffset: 0,
    mixedAudioUrl: "",
    editor: {tempo: 120, numerator: 4, denominator: 4, snap: 0.25, tool: "select", zoom: 72, selectedNote: -1, playhead: 0},
    undoStack: [],
    redoStack: [],
    synthesisRunning: false,
    synthesisLogs: [],
    synthesisTotal: 0,
    synthesisCompleted: 0,
    livePlayback: null,
    synthesisJobId: "",
    transportFrame: 0
  };
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const seconds = (value) => Number.isFinite(value) ? `${value.toFixed(2)} s` : "—";

  function setMode(mode) {
    resetSynthesisState();
    stopTransport();
    if (state.livePlayback) {
      cancelAnimationFrame(state.livePlayback.frame);
      state.livePlayback.audioContext.close();
      state.livePlayback = null;
    }
    state.mode = mode;
    state.active = 0;
    state.inference = null;
    $("#training-mode").setAttribute("aria-pressed", mode === "training");
    $("#inference-mode").setAttribute("aria-pressed", mode === "inference");
    $("#list-title").textContent = mode === "training" ? "学習録音" : "推論サンプル";
    $("#upload-box").classList.toggle("hidden", mode !== "inference");
    renderList();
    if (mode === "inference" && state.inferenceSamples.length) {
      loadInferenceSample(state.inferenceSamples[0]);
    }
  }

  function renderList() {
    const list = $("#record-list");
    const records = state.mode === "training" ? state.training : state.inferenceSamples;
    $("#list-count").textContent = `${records.length} FILES`;
    if (!records.length) {
      list.innerHTML = '<div class="empty">サンプルがありません</div>';
      return;
    }
    list.innerHTML = records.map((item, index) => {
      const name = state.mode === "training" ? item.name : item;
      const meta = state.mode === "training" ? `${item.labels.length} 音素 · ${seconds(item.duration)}` : "DiffSinger .ds";
      return `<button class="record-button ${index === state.active ? "active" : ""}" data-index="${index}"><span class="record-name">${escapeHtml(name)}</span><span class="record-meta">${escapeHtml(meta)}</span></button>`;
    }).join("");
    list.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => {
      state.active = Number(button.dataset.index);
      if (state.mode === "training") renderTraining();
      else loadInferenceSample(state.inferenceSamples[state.active]);
      renderList();
    }));
    if (state.mode === "training") renderTraining();
  }

  function timeline(items, label, totalDuration, durationKey = "duration") {
    if (!items.length) return `<div class="empty">${label}がありません</div>`;
    const knownTotal = items.reduce((sum, item) => sum + (Number(item[durationKey]) || 0), 0);
    const useEqual = !knownTotal;
    const weights = items.map((item) => useEqual ? 1 : Math.max(0, Number(item[durationKey]) || 0));
    const sum = weights.reduce((total, value) => total + value, 0) || items.length;
    let elapsed = 0;
    const phones = items.map((item, index) => {
      const duration = item[durationKey];
      const width = Math.max(.45, (weights[index] / sum) * 100);
      elapsed += weights[index];
      return `<div class="phone" style="width:${width}%" title="${escapeHtml(item.phoneme || item.note)} · ${seconds(duration)}"><b>${escapeHtml(item.phoneme || item.note)}</b><small>${duration == null ? "時間なし" : seconds(duration)}</small></div>`;
    }).join("");
    elapsed = 0;
    const boundaries = weights.slice(0, -1).map((weight) => {
      elapsed += weight;
      return `<i class="boundary-line" style="left:${(elapsed / sum) * 100}%"></i>`;
    }).join("");
    return `<div class="timeline">${phones}${boundaries}</div>`;
  }

  function renderTable(items) {
    return `<div class="table-wrap"><table><thead><tr><th>#</th><th>音素</th><th>開始</th><th>終了</th><th>長さ</th></tr></thead><tbody>${items.map((item, index) => {
      const start = Number.isFinite(item.start) ? item.start : null;
      const end = Number.isFinite(item.end) ? item.end : (start == null && item.duration != null ? item.duration : null);
      return `<tr><td class="num">${index + 1}</td><td class="phone-cell">${escapeHtml(item.phoneme)}</td><td class="num">${start == null ? "—" : start.toFixed(3)}</td><td class="num">${end == null ? "—" : end.toFixed(3)}</td><td class="num">${item.duration == null ? "—" : Number(item.duration).toFixed(3) + " s"}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  }

  function sourceSegments(sourceText = state.sourceText) {
    const data = JSON.parse(sourceText);
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.segments)) return data.segments;
    if (data && typeof data === "object") return [data];
    throw new Error("DSデータの形式を確認してください");
  }

  function normalizeSource(sourceText) {
    const raw = sourceSegments(sourceText);
    return {
      name: state.sourceName,
      source: sourceText,
      segments: raw.map((segment) => {
        const phones = String(segment.ph_seq || "").split(/\s+/).filter(Boolean);
        const phoneDurations = String(segment.ph_dur || "").split(/\s+/).map(Number);
        const notes = String(segment.note_seq || "").split(/\s+/).filter(Boolean);
        const noteDurations = String(segment.note_dur || "").split(/\s+/).map(Number);
        return {
          offset: Number(segment.offset) || 0,
          text: String(segment.text || ""),
          phonemes: phones.map((phoneme, index) => ({
            phoneme,
            duration: Number.isFinite(phoneDurations[index]) ? phoneDurations[index] : null,
          })),
          notes: notes.map((note, index) => ({
            note,
            duration: Number.isFinite(noteDurations[index]) ? noteDurations[index] : null,
          })),
          duration_mismatch: phones.length !== phoneDurations.length,
        };
      }),
    };
  }

  function syncActiveTrack() {
    const track = state.projectTracks[state.activeTrackIndex];
    if (track && state.inference) {
      if (track.sourceText !== state.sourceText) track.synthesisBlob = null;
      track.sourceText = state.sourceText;
      track.sourceName = state.sourceName;
      track.inference = state.inference;
    }
  }

  function saveUndoPoint() {
    state.undoStack.push(state.sourceText);
    if (state.undoStack.length > 50) state.undoStack.shift();
    state.redoStack = [];
  }

  function applySourceChange(change) {
    try {
      const data = JSON.parse(state.sourceText);
      const raw = Array.isArray(data) ? data : Array.isArray(data.segments) ? data.segments : [data];
      saveUndoPoint();
      change(raw);
      state.sourceText = JSON.stringify(data, null, 2);
      state.inference = {...state.inference, ...normalizeSource(state.sourceText)};
      stopTransport();
      clearInferenceAudio();
      resetSynthesisState();
      syncActiveTrack();
      updatePredictButton();
      renderInference(state.segment || 0);
      renderProjectTracks();
      return true;
    } catch (error) {
      const status = $("#editor-status");
      if (status) status.textContent = error.message;
      return false;
    }
  }

  function noteToMidi(note) {
    if (String(note).toLowerCase() === "rest") return null;
    const match = /^([A-Ga-g])([#b]?)(-?\d+)$/.exec(String(note));
    if (!match) return null;
    const offsets = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
    let pitch = offsets[match[1].toUpperCase()];
    if (match[2] === "#") pitch += 1;
    if (match[2] === "b") pitch -= 1;
    return (Number(match[3]) + 1) * 12 + pitch;
  }

  function midiToNote(midi) {
    const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const value = Math.max(0, Math.min(127, Math.round(midi)));
    return `${names[value % 12]}${Math.floor(value / 12) - 1}`;
  }

  function snapBeat(value) {
    const snap = Number(state.editor.snap);
    return snap > 0 ? Math.max(snap, Math.round(value / snap) * snap) : value;
  }

  function renderEditor(segment, segmentIndex) {
    const raw = sourceSegments()[segmentIndex] || {};
    const toolButton = (tool, label) => `<button type="button" data-editor-tool="${tool}" aria-pressed="${state.editor.tool === tool}">${label}</button>`;
    return `<section class="editor" aria-label="ピアノロール編集">
      <div class="editor-toolbar">
        <div class="transport"><button type="button" id="transport-play" title="再生">▶</button><button type="button" id="transport-stop" title="停止">■</button></div>
        ${toolButton("select", "選択")}
        ${toolButton("draw", "音符追加")}
        ${toolButton("erase", "削除")}
        <label>グリッド <select id="editor-snap"><option value="0.25">1/16</option><option value="0.5">1/8</option><option value="1">1/4</option><option value="2">1/2</option><option value="0">なし</option></select></label>
        <label>BPM <input class="editor-number" id="editor-tempo" type="number" min="30" max="300" value="${state.editor.tempo}"></label>
        <label>拍子 <input class="editor-number" id="editor-numerator" type="number" min="1" max="16" value="${state.editor.numerator}"> / <input class="editor-number" id="editor-denominator" type="number" min="1" max="16" value="${state.editor.denominator}"></label>
        <label>ズーム <input id="editor-zoom" type="range" min="36" max="160" value="${state.editor.zoom}"></label>
        <span class="tool-spacer"></span>
        <button type="button" id="editor-undo" ${state.undoStack.length ? "" : "disabled"}>元に戻す</button>
        <button type="button" id="editor-redo" ${state.redoStack.length ? "" : "disabled"}>やり直し</button>
        <button type="button" id="export-ds">このトラックをDS保存</button>
      </div>
      <div class="piano-scroll"><canvas id="piano-roll" tabindex="0" aria-label="音符を編集するピアノロール"></canvas></div>
      <div class="editor-foot"><span>ドラッグ: 音高変更 / 右端: 長さ変更 / ←→: 音符移動 / Shift+←→: 長さ / Delete: 削除</span><span class="editor-status" id="editor-status">フレーズ ${segmentIndex + 1} · ${escapeHtml(String(segment.offset || 0))} s</span></div>
      <div class="lyrics-editor">
        <label>歌詞 / 表示テキスト<input id="editor-text" value="${escapeHtml(raw.text || "")}"></label>
        <label>DS音素列（空白区切り）<input id="editor-phonemes" value="${escapeHtml(raw.ph_seq || "")}"></label>
        <button type="button" id="apply-lyrics">歌詞・音素を反映</button>
      </div>
    </section>`;
  }

  function drawPianoRoll(segment) {
    const canvas = $("#piano-roll");
    if (!canvas) return;
    const rowHeight = 14;
    const headerHeight = 24;
    const keyboardWidth = 48;
    const minMidi = 48;
    const maxMidi = 84;
    const beatSeconds = 60 / Math.max(30, Number(state.editor.tempo) || 120);
    const pxPerBeat = Number(state.editor.zoom) || 72;
    const notes = state.editor.previewNotes || segment.notes || [];
    const totalBeats = notes.reduce((sum, item) => sum + Math.max(0, Number(item.duration) || 0) / beatSeconds, 0);
    const width = Math.max(560, keyboardWidth + (Math.ceil(totalBeats) + 4) * pxPerBeat);
    const height = headerHeight + (maxMidi - minMidi + 1) * rowHeight;
    const ratio = window.devicePixelRatio || 1;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    const context = canvas.getContext("2d");
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.fillStyle = "#fff";
    context.fillRect(0, 0, width, height);
    const blackKeys = new Set([1, 3, 6, 8, 10]);
    for (let midi = maxMidi; midi >= minMidi; midi--) {
      const y = headerHeight + (maxMidi - midi) * rowHeight;
      context.fillStyle = blackKeys.has(midi % 12) ? "#f1f3f1" : "#fff";
      context.fillRect(keyboardWidth, y, width - keyboardWidth, rowHeight);
      context.fillStyle = "#f4f6f3";
      context.fillRect(0, y, keyboardWidth - 1, rowHeight);
      if (midi % 12 === 0) {
        context.fillStyle = "#67777a";
        context.font = "10px sans-serif";
        context.fillText(`C${midi / 12 - 1}`, 7, y + 10);
      }
      context.strokeStyle = midi % 12 === 0 ? "#bac6bf" : "#e4e9e5";
      context.beginPath();
      context.moveTo(0, y + rowHeight);
      context.lineTo(width, y + rowHeight);
      context.stroke();
    }
    const numerator = Math.max(1, Number(state.editor.numerator) || 4);
    const denominator = Math.max(1, Number(state.editor.denominator) || 4);
    const barBeats = numerator * 4 / denominator;
    const denominatorBeat = 4 / denominator;
    const gridStep = Math.min(1, denominatorBeat);
    const tickCount = Math.ceil((width - keyboardWidth) / pxPerBeat / gridStep);
    for (let tick = 0; tick <= tickCount; tick++) {
      const beat = tick * gridStep;
      const x = keyboardWidth + beat * pxPerBeat;
      const barStart = Math.abs(beat / barBeats - Math.round(beat / barBeats)) < 0.001;
      const beatStart = Math.abs(beat / denominatorBeat - Math.round(beat / denominatorBeat)) < 0.001;
      context.strokeStyle = barStart ? "#aebbb3" : beatStart ? "#cbd4ce" : "#e3e8e4";
      context.beginPath();
      context.moveTo(x, 0);
      context.lineTo(x, height);
      context.stroke();
      if (barStart) {
        context.fillStyle = "#65747a";
        context.font = "10px sans-serif";
        context.fillText(String(Math.floor(beat / barBeats) + 1), x + 3, 15);
      }
    }
    context.strokeStyle = "#b8c2bc";
    context.beginPath();
    context.moveTo(keyboardWidth, 0);
    context.lineTo(keyboardWidth, height);
    context.stroke();
    let elapsed = 0;
    notes.forEach((item, index) => {
      const duration = Math.max(0.02, Number(item.duration) || 0.25);
      const midi = noteToMidi(item.note);
      const x = keyboardWidth + elapsed / beatSeconds * pxPerBeat;
      const noteWidth = Math.max(6, duration / beatSeconds * pxPerBeat - 2);
      if (midi != null && midi >= minMidi && midi <= maxMidi) {
        const y = headerHeight + (maxMidi - midi) * rowHeight + 1;
        context.fillStyle = index === state.editor.selectedNote ? "#d55e4f" : "#218b7d";
        context.strokeStyle = index === state.editor.selectedNote ? "#a13d33" : "#126b62";
        context.beginPath();
        context.roundRect(x + 1, y, noteWidth, rowHeight - 2, 3);
        context.fill();
        context.stroke();
        context.save();
        context.beginPath();
        context.rect(x + 3, y, Math.max(0, noteWidth - 4), rowHeight - 2);
        context.clip();
        context.fillStyle = "#fff";
        context.font = "10px sans-serif";
        context.fillText(String(item.note), x + 5, y + 10);
        context.restore();
      }
      elapsed += duration;
    });
    const playheadX = keyboardWidth + state.editor.playhead / beatSeconds * pxPerBeat;
    context.strokeStyle = "#d55e4f";
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(playheadX, 0);
    context.lineTo(playheadX, height);
    context.stroke();
  }

  function rawNoteEvents(raw) {
    const pitches = String(raw.note_seq || "").split(/\s+/).filter(Boolean);
    const durations = String(raw.note_dur || "").split(/\s+/).map(Number);
    return pitches.map((pitch, index) => ({
      note: pitch,
      duration: Number.isFinite(durations[index]) && durations[index] > 0 ? durations[index] : 0.25,
      sourceIndex: index,
    }));
  }

  function interpolate(values, position) {
    if (!values.length) return 0;
    const bounded = Math.max(0, Math.min(values.length - 1, position));
    const left = Math.floor(bounded);
    const right = Math.min(values.length - 1, left + 1);
    return values[left] + (values[right] - values[left]) * (bounded - left);
  }

  function commitNoteEvents(segmentIndex, oldNotes, newNotes) {
    if (!newNotes.length) {
      const status = $("#editor-status");
      if (status) status.textContent = "最後の音符は削除できません";
      return;
    }
    const oldTotal = oldNotes.reduce((sum, item) => sum + item.duration, 0);
    const newTotal = newNotes.reduce((sum, item) => sum + item.duration, 0);
    if (newTotal <= 0 || !Number.isFinite(newTotal)) return;
    applySourceChange((segments) => {
      const raw = segments[segmentIndex];
      const oldPhoneDurations = String(raw.ph_dur || "").split(/\s+/).map(Number);
      const ratio = oldTotal > 0 ? newTotal / oldTotal : 1;
      raw.note_seq = newNotes.map((item) => item.note).join(" ");
      raw.note_dur = newNotes.map((item) => item.duration.toFixed(5)).join(" ");
      if (oldPhoneDurations.length) {
        raw.ph_dur = oldPhoneDurations.map((value) => (value * ratio).toFixed(6)).join(" ");
      }
      if (raw.note_dur_seq) {
        raw.note_dur_seq = String(raw.note_dur_seq).split(/\s+/).map(Number)
          .map((value) => (value * ratio).toFixed(5)).join(" ");
      }
      ["note_glide", "note_slur"].forEach((key) => {
        if (raw[key] == null) return;
        const values = Array.isArray(raw[key]) ? raw[key] : String(raw[key]).split(/\s+/);
        raw[key] = newNotes.map((item) =>
          Number.isInteger(item.sourceIndex) && item.sourceIndex >= 0
            ? (values[item.sourceIndex] ?? "0")
            : "0",
        ).join(" ");
      });
      const timestep = Number(raw.f0_timestep);
      const oldF0 = String(raw.f0_seq || "").split(/\s+/).map(Number).filter(Number.isFinite);
      if (timestep > 0 && oldF0.length) {
        const frameCount = Math.max(1, Math.round(newTotal / timestep));
        const oldStarts = [];
        let oldElapsed = 0;
        oldNotes.forEach((item) => {
          oldStarts.push(oldElapsed);
          oldElapsed += item.duration;
        });
        const newF0 = Array.from({length: frameCount}, (_, frame) => {
          const time = frame * timestep;
          let elapsed = 0;
          for (let index = 0; index < newNotes.length; index++) {
            const note = newNotes[index];
            if (time <= elapsed + note.duration || index === newNotes.length - 1) {
              const fraction = Math.max(0, Math.min(1, (time - elapsed) / note.duration));
              const sourceIndex = Number.isInteger(note.sourceIndex) ? note.sourceIndex : -1;
              if (sourceIndex >= 0 && sourceIndex < oldNotes.length) {
                const oldNote = oldNotes[sourceIndex];
                const sourceTime = oldStarts[sourceIndex] + fraction * oldNote.duration;
                let value = interpolate(oldF0, sourceTime / timestep);
                const oldMidi = noteToMidi(oldNote.note);
                const newMidi = noteToMidi(note.note);
                if (oldMidi != null && newMidi != null) value *= 2 ** ((newMidi - oldMidi) / 12);
                return value;
              }
              const midi = noteToMidi(note.note);
              return midi == null ? 0 : 440 * 2 ** ((midi - 69) / 12);
            }
            elapsed += note.duration;
          }
          return oldF0[oldF0.length - 1];
        });
        raw.f0_seq = newF0.map((value) => value.toFixed(2)).join(" ");
      }
    });
  }

  function restoreEdit(undo) {
    const source = undo ? state.undoStack.pop() : state.redoStack.pop();
    if (!source) return;
    (undo ? state.redoStack : state.undoStack).push(state.sourceText);
    state.sourceText = source;
    state.inference = {...state.inference, ...normalizeSource(source)};
    clearInferenceAudio();
    resetSynthesisState();
    syncActiveTrack();
    updatePredictButton();
    renderInference(state.segment || 0);
    renderProjectTracks();
  }

  function bindEditor(segment) {
    const canvas = $("#piano-roll");
    const setStatus = (message) => {
      const status = $("#editor-status");
      if (status) status.textContent = message;
    };
    const redraw = () => drawPianoRoll(segment);
    const snap = $("#editor-snap");
    if (snap) snap.value = String(state.editor.snap);
    document.querySelectorAll("[data-editor-tool]").forEach((button) => {
      button.addEventListener("click", () => {
        state.editor.tool = button.dataset.editorTool;
        document.querySelectorAll("[data-editor-tool]").forEach((item) =>
          item.setAttribute("aria-pressed", String(item === button)));
        if (canvas) canvas.focus();
      });
    });
    const tempo = $("#editor-tempo");
    if (tempo) tempo.addEventListener("change", () => {
      state.editor.tempo = Math.max(30, Math.min(300, Number(tempo.value) || 120));
      tempo.value = String(state.editor.tempo);
      redraw();
    });
    ["numerator", "denominator"].forEach((key) => {
      const input = $(`#editor-${key}`);
      if (input) input.addEventListener("change", () => {
        state.editor[key] = Math.max(1, Math.min(16, Number(input.value) || 4));
        input.value = String(state.editor[key]);
        redraw();
      });
    });
    if (snap) snap.addEventListener("change", () => {
      state.editor.snap = Number(snap.value);
    });
    const zoom = $("#editor-zoom");
    if (zoom) zoom.addEventListener("input", () => {
      state.editor.zoom = Number(zoom.value);
      redraw();
    });
    $("#editor-undo").addEventListener("click", () => restoreEdit(true));
    $("#editor-redo").addEventListener("click", () => restoreEdit(false));
    $("#export-ds").addEventListener("click", exportActiveDs);
    $("#apply-lyrics").addEventListener("click", () => {
      const text = $("#editor-text").value;
      const phonemes = $("#editor-phonemes").value.trim().split(/\s+/).filter(Boolean);
      if (!phonemes.length) {
        setStatus("音素列を空にはできません");
        return;
      }
      applySourceChange((segments) => {
        const raw = segments[state.segment];
        const previous = String(raw.ph_dur || "").split(/\s+/).map(Number).filter(Number.isFinite);
        const total = previous.reduce((sum, value) => sum + value, 0) || 0.5;
        raw.text = text;
        raw.ph_seq = phonemes.join(" ");
        raw.ph_dur = phonemes.map((_, index) =>
          (previous[index] ?? total / phonemes.length).toFixed(6)).join(" ");
        if (previous.length !== phonemes.length) {
          const adjusted = phonemes.map((_, index) => previous[index] ?? total / phonemes.length);
          const adjustedTotal = adjusted.reduce((sum, value) => sum + value, 0);
          raw.ph_dur = adjusted.map((value) => (value * total / adjustedTotal).toFixed(6)).join(" ");
        }
      });
    });
    $("#transport-play").addEventListener("click", startTransport);
    $("#transport-stop").addEventListener("click", stopTransport);
    if (!canvas) return;
    const coordinates = (event) => {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: event.clientX - bounds.left,
        y: event.clientY - bounds.top,
      };
    };
    const noteAt = (point, notes) => {
      const keyboardWidth = 48;
      const headerHeight = 24;
      const rowHeight = 14;
      const midi = 84 - Math.floor((point.y - headerHeight) / rowHeight);
      const beatSeconds = 60 / state.editor.tempo;
      const beat = (point.x - keyboardWidth) / state.editor.zoom;
      let elapsed = 0;
      for (let index = 0; index < notes.length; index++) {
        const duration = notes[index].duration;
        const startBeat = elapsed / beatSeconds;
        const endBeat = (elapsed + duration) / beatSeconds;
        const noteMidi = noteToMidi(notes[index].note);
        if (beat >= startBeat && beat <= endBeat && noteMidi === midi) {
          return {index, nearEnd: beat >= endBeat - Math.min(0.18, (endBeat - startBeat) / 4)};
        }
        elapsed += duration;
      }
      return null;
    };
    let drag = null;
    canvas.addEventListener("pointerdown", (event) => {
      const point = coordinates(event);
      const notes = rawNoteEvents(sourceSegments()[state.segment] || {});
      const hit = noteAt(point, notes);
      if (state.editor.tool === "erase") {
        if (hit) commitNoteEvents(state.segment, notes, notes.filter((_, index) => index !== hit.index));
        return;
      }
      if (state.editor.tool === "draw") {
        const total = notes.reduce((sum, item) => sum + item.duration, 0);
        const targetBeat = (point.x - 48) / state.editor.zoom;
        if (targetBeat * (60 / state.editor.tempo) < total - 0.05) {
          setStatus("追加位置をフレーズ末尾へ移動してください");
          return;
        }
        const midi = Math.max(48, Math.min(84, 84 - Math.floor((point.y - 24) / 14)));
        notes.push({note: midiToNote(midi), duration: snapBeat(0.5) * 60 / state.editor.tempo, sourceIndex: -1});
        state.editor.selectedNote = notes.length - 1;
        commitNoteEvents(state.segment, rawNoteEvents(sourceSegments()[state.segment] || {}), notes);
        return;
      }
      if (!hit) {
        state.editor.selectedNote = -1;
        redraw();
        return;
      }
      state.editor.selectedNote = hit.index;
      drag = {
        point,
        notes,
        index: hit.index,
        mode: hit.nearEnd ? "resize" : "pitch",
        originalDuration: notes[hit.index].duration,
        changed: false,
      };
      canvas.setPointerCapture(event.pointerId);
      redraw();
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const point = coordinates(event);
      const edited = drag.notes.map((item) => ({...item}));
      if (drag.mode === "resize") {
        const deltaBeats = (point.x - drag.point.x) / state.editor.zoom;
        const minimum = state.editor.snap > 0 ? state.editor.snap : 0.05;
        edited[drag.index].duration = Math.max(
          minimum * 60 / state.editor.tempo,
          snapBeat(drag.originalDuration * state.editor.tempo / 60 + deltaBeats) * 60 / state.editor.tempo,
        );
      } else {
        const midi = Math.max(48, Math.min(84, 84 - Math.floor((point.y - 24) / 14)));
        edited[drag.index].note = midiToNote(midi);
      }
      drag.changed ||= edited.some((item, index) =>
        item.note !== drag.notes[index].note || Math.abs(item.duration - drag.notes[index].duration) > 0.00001);
      state.editor.previewNotes = edited;
      redraw();
    });
    const endDrag = () => {
      if (!drag) return;
      const edited = state.editor.previewNotes || drag.notes;
      const changed = drag.changed && edited.some((item, index) =>
        item.note !== drag.notes[index].note || Math.abs(item.duration - drag.notes[index].duration) > 0.00001);
      state.editor.previewNotes = null;
      const oldNotes = rawNoteEvents(sourceSegments()[state.segment] || {});
      drag = null;
      if (changed) commitNoteEvents(state.segment, oldNotes, edited);
      else redraw();
    };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    canvas.addEventListener("keydown", (event) => {
      const index = state.editor.selectedNote;
      if (index < 0) return;
      const notes = rawNoteEvents(sourceSegments()[state.segment] || {});
      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        commitNoteEvents(state.segment, notes, notes.filter((_, itemIndex) => itemIndex !== index));
      } else if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        const edited = notes.map((item) => ({...item}));
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          const midi = noteToMidi(edited[index].note);
          if (midi != null) edited[index].note = midiToNote(midi + (event.key === "ArrowUp" ? 1 : -1));
        } else if (event.shiftKey) {
          const delta = state.editor.snap * 60 / state.editor.tempo * (event.key === "ArrowRight" ? 1 : -1);
          edited[index].duration = Math.max(0.03, edited[index].duration + delta);
        } else {
          const target = Math.max(0, Math.min(edited.length - 1, index + (event.key === "ArrowRight" ? 1 : -1)));
          [edited[index], edited[target]] = [edited[target], edited[index]];
          state.editor.selectedNote = target;
        }
        commitNoteEvents(state.segment, notes, edited);
      }
    });
    drawPianoRoll(segment);
  }

  function downloadText(filename, content, type) {
    const url = URL.createObjectURL(new Blob([content], {type}));
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportActiveDs() {
    if (!state.sourceText) return;
    syncActiveTrack();
    const baseName = state.sourceName.replace(/\.[^.]+$/, "") || "track";
    downloadText(`${baseName}.ds`, state.sourceText, "application/json;charset=utf-8");
  }

  async function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    const chunkSize = 0x8000;
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
    }
    return btoa(binary);
  }

  function base64ToArrayBuffer(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    return bytes.buffer;
  }

  function clearBgmData() {
    if (state.bgm?.url) URL.revokeObjectURL(state.bgm.url);
    state.bgm = null;
  }

  async function setBgmData(name, bytes, mimeType = "audio/wav", offset = 0, gain = 0.7) {
    stopTransport();
    if (state.bgm?.url) URL.revokeObjectURL(state.bgm.url);
    const decoder = new AudioContext();
    try {
      const buffer = await decoder.decodeAudioData(bytes.slice(0));
      state.bgm = {
        name,
        bytes,
        mimeType,
        buffer,
        url: URL.createObjectURL(new Blob([bytes], {type: mimeType})),
        offset: Math.max(0, Number(offset) || 0),
        gain: Math.max(0, Number(gain) || 0),
      };
    } finally {
      await decoder.close();
    }
    if (state.generatedAudio) clearInferenceAudio();
    if (state.inference && /\.(ds|json)$/i.test(state.sourceName)) renderInference(state.segment || 0);
  }

  async function loadBgmFile(file) {
    const bytes = await file.arrayBuffer();
    await setBgmData(file.name, bytes, file.type || "audio/wav");
  }

  async function saveProject() {
    if (!state.projectTracks.length) return;
    syncActiveTrack();
    const project = {
      format: "diffsinger-web-editor",
      version: 1,
      tempo: state.editor.tempo,
      time_signature: [state.editor.numerator, state.editor.denominator],
      tracks: state.projectTracks.map((track) => ({
        name: track.name,
        source_name: track.sourceName,
        source_text: track.sourceText,
        mix_offset: Number(track.mixOffset) || 0,
        gain: Number(track.gain ?? 1),
      })),
      bgm: state.bgm ? {
        name: state.bgm.name,
        mime_type: state.bgm.mimeType,
        offset: state.bgm.offset,
        gain: state.bgm.gain,
        data_base64: await arrayBufferToBase64(state.bgm.bytes),
      } : null,
    };
    const baseName = state.projectTracks[0].name.replace(/\.[^.]+$/, "") || "project";
    downloadText(`${baseName}.dsproj`, JSON.stringify(project, null, 2), "application/json;charset=utf-8");
  }

    ).join("");
    list.querySelectorAll("[data-track-index]").forEach((button) => button.addEventListener("click", () => {
      const index = Number(button.dataset.trackIndex);
      if (index === state.activeTrackIndex) return;
      syncActiveTrack();
      stopTransport();
      resetSynthesisState();
      clearInferenceAudio();
      state.activeTrackIndex = index;
      state.segment = 0;
      state.editor.selectedNote = -1;
      const track = state.projectTracks[index];
      state.sourceName = track.sourceName;
      state.sourceText = track.sourceText;
      state.inference = track.inference;

      const removedIndex = Number(button.dataset.removeTrack);
      stopTransport();
      resetSynthesisState();
      clearInferenceAudio();
      state.projectTracks.splice(removedIndex, 1);
      if (removedIndex === state.activeTrackIndex) {
        state.activeTrackIndex = Math.max(0, removedIndex - 1);
        state.segment = 0;
        state.editor.selectedNote = -1;
        const track = state.projectTracks[state.activeTrackIndex];
        state.sourceName = track.sourceName;
        state.sourceText = track.sourceText;
        state.inference = track.inference;
        state.undoStack = [];
        state.redoStack = [];
        updatePredictButton();
        renderInference();

        state.activeTrackIndex--;
      }
      renderProjectTracks();
    }));
  }

  function setProjectTracks(tracks) {
    if (!tracks.length) throw new Error("プロジェクトにトラックがありません");
    stopTransport();
    resetSynthesisState();
    clearInferenceAudio();
    state.projectTracks = tracks;
    state.activeTrackIndex = 0;
    state.segment = 0;
    state.editor.selectedNote = -1;
    state.active = -1;
    state.sourceName = tracks[0].sourceName;
    state.sourceText = tracks[0].sourceText;
    state.inference = tracks[0].inference;
    state.undoStack = [];
    state.redoStack = [];
    updatePredictButton();
    renderProjectTracks();
  }

  let transportAudio = null;

  function stopTransport() {
    if (state.transportFrame) cancelAnimationFrame(state.transportFrame);
    state.transportFrame = 0;
    if (state.transportTimer) clearTimeout(state.transportTimer);
    state.transportTimer = 0;
    if (state.livePlayback) {
      state.livePlayback.stopped = true;
      cancelAnimationFrame(state.livePlayback.frame);
      state.livePlayback.sources.forEach((source) => source.stop());
      state.livePlayback.sources.clear();
    }
    if (transportAudio) {
      transportAudio.pause();
      transportAudio = null;
    }
    state.editor.playhead = 0;
    if (state.inference?.segments?.[state.segment || 0]) {
      drawPianoRoll(state.inference.segments[state.segment || 0]);
    }
  }

  function startTransport() {
    const playbackUrl = state.audioUrl || state.bgm?.url;
    if (!playbackUrl) {
      const status = $("#editor-status");
      if (status) status.textContent = "再生する音声がありません。WAVを合成するか読み込んでください";
      return;
    }
    stopTransport();
    transportAudio = new Audio(playbackUrl);
    if (!state.audioUrl && state.bgm) transportAudio.volume = Math.min(1, state.bgm.gain);
    const offset = Number(state.inference?.segments?.[state.segment || 0]?.offset) || 0;
    transportAudio.addEventListener("loadedmetadata", () => {
      if (offset < transportAudio.duration) transportAudio.currentTime = offset;
    }, {once: true});
    transportAudio.addEventListener("ended", stopTransport, {once: true});
    const play = () => {
      transportAudio?.play().then(() => {
        const update = () => {
          if (!transportAudio) return;
          state.editor.playhead = Math.max(0, transportAudio.currentTime - offset);
          const current = state.inference?.segments?.[state.segment || 0];
          if (current) drawPianoRoll(current);
          state.transportFrame = requestAnimationFrame(update);
        };
        state.transportFrame = requestAnimationFrame(update);
      }).catch((error) => {
        const status = $("#editor-status");
        if (status) status.textContent = `再生に失敗しました: ${error.message}`;
      });
    };
    if (!state.audioUrl && state.bgm?.offset > 0) {
      state.transportTimer = setTimeout(play, state.bgm.offset * 1000);
    } else {
      play();
    }
  }

  function applyProjectSettings(project) {
    state.editor.tempo = Math.max(30, Math.min(300, Number(project.tempo) || 120));
    const signature = Array.isArray(project.time_signature) ? project.time_signature : [4, 4];
    state.editor.numerator = Math.max(1, Math.min(16, Number(signature[0]) || 4));
    state.editor.denominator = Math.max(1, Math.min(16, Number(signature[1]) || 4));
  }

  function trackDuration(track) {
    return track.inference.segments.reduce((end, segment) => {
      const duration = segment.notes.reduce((sum, note) => sum + (Number(note.duration) || 0), 0) ||
        segment.phonemes.reduce((sum, phone) => sum + (Number(phone.duration) || 0), 0);
      return Math.max(end, (Number(track.mixOffset) || 0) + (Number(segment.offset) || 0) + duration);
    }, 0);
  }

  function renderArrangement() {
    const trackNames = state.projectTracks.map((track) => escapeHtml(track.name)).join(" / ");
    return `<section class="arrangement" aria-label="BGMと歌声トラックのタイミング編集">
      <div class="arrangement-head"><span>タイミング合わせ · BGM / 歌声 ${state.projectTracks.length} トラック</span><span>${trackNames}</span></div>
      <div class="arrangement-controls">
        <label>BGM位置 (秒) <input id="bgm-offset" type="number" min="0" step="0.01" value="${Number(state.bgm?.offset || 0).toFixed(2)}" ${state.bgm ? "" : "disabled"}></label>
        <label>BGM音量 <input id="bgm-gain" type="range" min="0" max="1.5" step="0.01" value="${Number(state.bgm?.gain ?? 0.7)}" ${state.bgm ? "" : "disabled"}></label>
        <label>歌声トラック <select id="mix-track-select">${state.projectTracks.map((track, index) => `<option value="${index}" ${index === state.activeTrackIndex ? "selected" : ""}>${escapeHtml(track.name)}</option>`).join("")}</select></label>
        <label>位置 (秒) <input id="voice-offset" type="number" min="0" step="0.01" value="${Number(state.projectTracks[state.activeTrackIndex]?.mixOffset || 0).toFixed(2)}"></label>

        <button type="button" id="play-arrangement" ${state.bgm || state.audioUrl ? "" : "disabled"}>▶ 音源を再生</button>
        <button type="button" id="remix-arrangement" ${state.projectTracks.some((track) => track.synthesisBlob) ? "" : "disabled"}>ミックスを更新</button>
        <button type="button" id="clear-bgm" ${state.bgm ? "" : "disabled"}>BGMを外す</button>
      </div>
      <div class="arrangement-scroll"><canvas id="arrangement-wave" tabindex="0" aria-label="BGMと歌声トラックの波形・位置"></canvas></div>
      <div class="arrangement-help">波形を左右にドラッグしてBGM位置を合わせます。歌声レーンをドラッグするとトラック位置を調整します。最終ミックスは「全歌声トラックを合成・ミックス」で作成します。</div>
    </section>`;
  }

  function drawArrangement() {
    const canvas = $("#arrangement-wave");
    if (!canvas) return;
    const pxPerSecond = 80;
    const labelWidth = 100;
    const rowHeight = 32;
    const height = 22 + rowHeight * (state.projectTracks.length + 1);
    const lastVoice = state.projectTracks.reduce((end, track) => Math.max(end, trackDuration(track)), 0);
    const bgmDuration = state.bgm?.buffer?.duration || 0;
    const totalTime = Math.max(8, lastVoice, bgmDuration + Number(state.bgm?.offset || 0));
    const width = Math.max(560, labelWidth + totalTime * pxPerSecond + 40);
    const ratio = window.devicePixelRatio || 1;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    const context = canvas.getContext("2d");
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.fillStyle = "#fff";
    context.fillRect(0, 0, width, height);
    for (let second = 0; second <= totalTime; second++) {
      const x = labelWidth + second * pxPerSecond;
      context.strokeStyle = second % 5 === 0 ? "#cbd5ce" : "#e8ede9";
      context.beginPath();
      context.moveTo(x, 0);
      context.lineTo(x, height);
      context.stroke();
      context.fillStyle = "#65747a";
      context.font = "9px sans-serif";
      context.fillText(`${second}s`, x + 3, 12);
    }
    const drawLane = (row, label, color) => {
      const y = 22 + row * rowHeight;
      context.fillStyle = "#f4f7f4";
      context.fillRect(0, y, labelWidth - 1, rowHeight);
      context.fillStyle = "#52625f";
      context.font = "10px sans-serif";
      context.fillText(label.slice(0, 15), 6, y + 19);
      context.strokeStyle = "#e3e8e4";
      context.beginPath();
      context.moveTo(0, y + rowHeight);
      context.lineTo(width, y + rowHeight);
      context.stroke();
      return {y, color};
    };
    const bgmLane = drawLane(0, state.bgm?.name || "BGM 未読込", "#4b91a0");
    if (state.bgm?.buffer) {
      const buffer = state.bgm.buffer;
      const channel = buffer.getChannelData(0);
      const startX = labelWidth + Math.max(0, Number(state.bgm.offset) || 0) * pxPerSecond;
      const drawnWidth = buffer.duration * pxPerSecond;
      const midY = bgmLane.y + rowHeight / 2;
      context.fillStyle = "rgba(75,145,160,.25)";
      context.fillRect(startX, bgmLane.y + 2, drawnWidth, rowHeight - 4);
      context.strokeStyle = bgmLane.color;
      context.beginPath();
      const step = Math.max(1, Math.floor(channel.length / Math.max(1, Math.floor(drawnWidth))));
      for (let x = 0; x < drawnWidth; x++) {
        const from = Math.floor(x * step);
        const to = Math.min(channel.length, from + step);
        let peak = 0;
        for (let sample = from; sample < to; sample += Math.max(1, Math.floor(step / 16))) {
          peak = Math.max(peak, Math.abs(channel[sample]));
        }
        const amplitude = peak * (rowHeight * 0.42);
        context.moveTo(startX + x, midY - amplitude);
        context.lineTo(startX + x, midY + amplitude);
      }
      context.stroke();
    }
    state.projectTracks.forEach((track, index) => {
      const lane = drawLane(index + 1, `歌声 ${track.name}`, "#258b7b");
      for (const segment of track.inference.segments) {
        const duration = segment.notes.reduce((sum, note) => sum + (Number(note.duration) || 0), 0) ||
          segment.phonemes.reduce((sum, phone) => sum + (Number(phone.duration) || 0), 0);
        const start = (Number(track.mixOffset) || 0) + (Number(segment.offset) || 0);
        const x = labelWidth + start * pxPerSecond;
        const barWidth = Math.max(2, duration * pxPerSecond);
        context.fillStyle = lane.color;
        context.globalAlpha = index === state.activeTrackIndex ? 0.85 : 0.55;
        context.fillRect(x, lane.y + 7, barWidth, rowHeight - 14);
        context.globalAlpha = 1;
        context.fillStyle = "#fff";
        context.font = "9px sans-serif";
        if (barWidth > 35) context.fillText(segment.text || "音符", x + 4, lane.y + 19, barWidth - 6);
      }
    });
    const previewOffset = state.arrangementDrag ? state.arrangementDrag.previewOffset : null;
    if (state.arrangementDrag?.type === "bgm" && previewOffset != null && bgmDuration) {
      const x = labelWidth + Math.max(0, previewOffset) * pxPerSecond;
      context.strokeStyle = "#d55e4f";
      context.setLineDash([4, 3]);
      context.strokeRect(x, bgmLane.y + 2, bgmDuration * pxPerSecond, rowHeight - 4);
      context.setLineDash([]);
    }
  }

  function bindArrangement() {
    const offsetInput = $("#bgm-offset");
    const gainInput = $("#bgm-gain");
    if (offsetInput) offsetInput.addEventListener("change", () => {
      if (!state.bgm) return;
      state.bgm.offset = Math.max(0, Number(offsetInput.value) || 0);
      offsetInput.value = state.bgm.offset.toFixed(2);
      if (state.generatedAudio) clearInferenceAudio();
      drawArrangement();
    });
    if (gainInput) gainInput.addEventListener("input", () => {
      if (state.bgm) {
        state.bgm.gain = Math.max(0, Number(gainInput.value) || 0);
        if (state.generatedAudio) clearInferenceAudio();
      }
    });
    const trackSelect = $("#mix-track-select");
    const voiceOffset = $("#voice-offset");
    const voiceGain = $("#voice-gain");
    const updateVoiceControls = () => {
      const track = state.projectTracks[Number(trackSelect?.value)];
      if (!track) return;
      if (voiceOffset) voiceOffset.value = Number(track.mixOffset || 0).toFixed(2);
      if (voiceGain) voiceGain.value = String(Number(track.gain ?? 1));
    };
    if (trackSelect) trackSelect.addEventListener("change", updateVoiceControls);
    if (voiceOffset) voiceOffset.addEventListener("change", () => {
      const track = state.projectTracks[Number(trackSelect?.value)];
      if (!track) return;
      track.mixOffset = Math.max(0, Number(voiceOffset.value) || 0);
      voiceOffset.value = track.mixOffset.toFixed(2);
      if (state.generatedAudio) clearInferenceAudio();
      drawArrangement();
    });
    if (voiceGain) voiceGain.addEventListener("input", () => {
      const track = state.projectTracks[Number(trackSelect?.value)];
      if (track) {
        track.gain = Math.max(0, Number(voiceGain.value) || 0);
        if (state.generatedAudio) clearInferenceAudio();
      }
    });
    const canvas = $("#arrangement-wave");
    if (!canvas) return;
    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      const y = event.clientY - rect.top;
      const row = Math.floor((y - 22) / 32);
      if (row === 0 && state.bgm) {
        state.arrangementDrag = {type: "bgm", startX: event.clientX, originalOffset: state.bgm.offset || 0, previewOffset: state.bgm.offset || 0};
      } else if (row > 0 && row <= state.projectTracks.length) {
        const track = state.projectTracks[row - 1];
        state.arrangementDrag = {type: "voice", track, startX: event.clientX, originalOffset: Number(track.mixOffset) || 0, previewOffset: Number(track.mixOffset) || 0};
      } else {
        return;
      }
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      const drag = state.arrangementDrag;
      if (!drag) return;
      drag.previewOffset = Math.max(0, drag.originalOffset + (event.clientX - drag.startX) / 80);
      drawArrangement();
    });
    const finishDrag = () => {
      const drag = state.arrangementDrag;
      if (!drag) return;
      if (drag.type === "bgm" && state.bgm) {
        state.bgm.offset = drag.previewOffset;
        const input = $("#bgm-offset");
        if (input) input.value = state.bgm.offset.toFixed(2);
      } else if (drag.track) {
        drag.track.mixOffset = drag.previewOffset;
      }
      if (state.generatedAudio) clearInferenceAudio();
      state.arrangementDrag = null;
      drawArrangement();
    };
    canvas.addEventListener("pointerup", finishDrag);
    canvas.addEventListener("pointercancel", finishDrag);
    $("#play-arrangement").addEventListener("click", startTransport);
    $("#remix-arrangement").addEventListener("click", remixCachedTracks);
    $("#clear-bgm").addEventListener("click", () => {
      clearBgmData();
      if (state.generatedAudio) clearInferenceAudio();
      drawArrangement();
      renderInference(state.segment || 0);
    });
    drawArrangement();
  }

  function renderTraining() {
